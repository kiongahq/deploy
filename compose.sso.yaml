# Single sign-on for the local stack: Dex brokers LDAP (a GLAuth test
# directory here; any LDAP/AD, SAML, GitHub, Google or OIDC provider in real
# deployments) and the gateway trusts Dex. Local accounts stay enabled as
# break-glass access.
#
#   docker compose -f compose.yaml -f compose.sso.yaml up -d
#   make sso-up
#
# Test users (password kionga-sso-dev): ada (ml-admins -> admin),
# grace (data-team -> engineer), alan (no mapped group).
services:
  glauth:
    image: glauth/glauth:v2.5.4@sha256:6d448805cf54fc2ca3bca2b87f89dffe571a354a69a667b5a910111be3cf430e
    # The image's start script runs glauth with /app/config/config.cfg.
    volumes:
      - ./sso/glauth.cfg:/app/config/config.cfg:ro
    expose: ["3893"]

  dex:
    image: ghcr.io/dexidp/dex:v2.46.0@sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      DEX_KIONGA_CLIENT_SECRET: ${DEX_KIONGA_CLIENT_SECRET:-kionga-local-sso-client-secret}
      DEX_LDAP_BIND_PASSWORD: ${DEX_LDAP_BIND_PASSWORD:-dex-bind-dev}
    volumes:
      - ./sso/dex.yaml:/etc/dex/config.yaml:ro
    ports: ["${DEX_PORT:-5556}:5556"]
    depends_on: [glauth]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:5556/dex/.well-known/openid-configuration]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway:
    depends_on:
      dex: {condition: service_healthy}
    environment:
      OIDC_ISSUER: http://localhost:5556/dex
      OIDC_AUDIENCE: kionga
      OIDC_CLIENT_ID: kionga
      OIDC_CLIENT_SECRET: ${DEX_KIONGA_CLIENT_SECRET:-kionga-local-sso-client-secret}
      OIDC_AUTH_URL: http://localhost:5556/dex/auth        # the browser
      OIDC_TOKEN_URL: http://dex:5556/dex/token            # the gateway
      OIDC_JWKS_URL: http://dex:5556/dex/keys
      OIDC_REDIRECT_URL: http://localhost:${GATEWAY_PORT:-8080}/auth/callback
      KIONGA_SSO_SINGLE_TENANT: "true"
      KIONGA_SSO_PROVIDERS: '[{"id":"ldap","name":"Company directory","type":"ldap"}]'
      KIONGA_SSO_GROUP_ROLES: '{"ml-admins":"admin","data-team":"engineer"}'
      KIONGA_LOCAL_LOGIN: "true"
