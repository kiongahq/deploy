name: Publish Helm chart
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-chart-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  chart:
    if: '!github.event.release.prerelease'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: kiongahq/.github/release/validate@717e2cc3be707aff75c717662c6b3fea58ab56d8
        with:
          tag: ${{ github.event.release.tag_name }}
          default-branch: ${{ github.event.repository.default_branch }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.21.0
      - name: Validate and package the chart
        run: |
          helm lint helm/kionga --strict
          helm package helm/kionga --destination dist
          cd dist
          sha256sum ./*.tgz > SHA256SUMS
      - name: Attach chart and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
