name: Kubernetes e2e

# Live-cluster lane: builds Kionga from the selected component refs, installs
# the prerequisites and the chart on kind the way a customer would, then runs
# scripts/e2e-runtime.py (application, pod recovery, scale-up, function scale to
# zero and wake, agent, model prediction, pipeline through the Jobs executor).
# Images go to a registry on the runner only; nothing is pushed anywhere else.
# It needs the operator controllers and the applications API in kiongahq/platform:
# until they merge, dispatch it with platform_ref set to their branch. On a pull
# request it runs when the kubernetes-e2e label is added (refs from kind/ci/refs.env).
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      platform_ref:
        description: kiongahq/platform branch, tag or commit (gateway, operator, Go services)
        default: main
      agent_runtime_ref:
        description: kiongahq/agent-runtime ref
        default: main
      sdk_python_ref:
        description: kiongahq/sdk-python ref (built into agent-runtime)
        default: main
      trace_proxy_ref:
        description: kiongahq/trace-proxy ref
        default: main
      steps:
        description: Comma-separated e2e steps (default all)
        default: application,recovery,scale-up,function,agent,model,pipeline

permissions:
  contents: read

concurrency:
  group: kubernetes-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'kubernetes-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KIONGA_SRC: ${{ github.workspace }}/src
      OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Free disk space for image builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force >/dev/null
          df -h /
      - name: Check out the components at the selected refs
        env:
          INPUT_PLATFORM_REF: ${{ inputs.platform_ref }}
          INPUT_AGENT_RUNTIME_REF: ${{ inputs.agent_runtime_ref }}
          INPUT_SDK_PYTHON_REF: ${{ inputs.sdk_python_ref }}
          INPUT_TRACE_PROXY_REF: ${{ inputs.trace_proxy_ref }}
        run: |
          source kind/ci/refs.env
          PLATFORM_REF="${INPUT_PLATFORM_REF:-$PLATFORM_REF}"
          AGENT_RUNTIME_REF="${INPUT_AGENT_RUNTIME_REF:-$AGENT_RUNTIME_REF}"
          SDK_PYTHON_REF="${INPUT_SDK_PYTHON_REF:-$SDK_PYTHON_REF}"
          TRACE_PROXY_REF="${INPUT_TRACE_PROXY_REF:-$TRACE_PROXY_REF}"
          fetch() {
            git init -q "$KIONGA_SRC/$1"
            git -C "$KIONGA_SRC/$1" fetch -q --depth=1 "https://github.com/kiongahq/$1.git" "$2"
            git -C "$KIONGA_SRC/$1" checkout -q FETCH_HEAD
            echo "$1 $2 $(git -C "$KIONGA_SRC/$1" rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          fetch platform "$PLATFORM_REF"
          fetch agent-runtime "$AGENT_RUNTIME_REF"
          fetch sdk-python "$SDK_PYTHON_REF"
          fetch trace-proxy "$TRACE_PROXY_REF"
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: {version: v3.21.0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - name: Build, install prerequisites and the chart
        run: bash scripts/kind-ci-up.sh
      - name: Run the e2e steps
        env:
          STEPS: ${{ inputs.steps || 'application,recovery,scale-up,function,agent,model,pipeline' }}
        run: |
          set -a; source "$OUT/images.env"; set +a
          python3 scripts/e2e-runtime.py --context kind-kionga-e2e --namespace kionga-workloads \
            --base-domain apps.127.0.0.1.sslip.io --gateway-url https://kionga.127.0.0.1.sslip.io \
            --ca-file "$OUT/ca.crt" --agent-image "$agent_runtime" --local-password-file "$OUT/local-password" \
            --scale-down-seconds 30 --steps "$STEPS" --report "$OUT/e2e-report.json"
      - name: Summarize
        if: always()
        run: |
          if [ -f "$OUT/e2e-report.json" ]; then
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("| Step | Result | Seconds | Detail |\n|---|---|---|---|"); [print(f"| {x[\"step\"]} | {x[\"status\"]} | {x[\"seconds\"]} | {x[\"detail\"][:200].replace(\"|\", \"/\")} |") for x in r]' "$OUT/e2e-report.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Collect a support bundle
        if: always()
        run: |
          kubectl config use-context kind-kionga-e2e 2>/dev/null || exit 0
          python3 scripts/support-bundle.py --context kind-kionga-e2e --output "$OUT/support-bundle.tar.gz" || true
          kubectl get pods -A -o wide || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kubernetes-e2e
          path: |
            e2e-out/e2e-report.json
            e2e-out/support-bundle.tar.gz
          if-no-files-found: ignore
          retention-days: 7
