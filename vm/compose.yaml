# Standalone production pilot: never merge deploy/compose.yaml into this stack.
name: kionga-public
services:
  gateway:
    image: ${KIONGA_GATEWAY_IMAGE:?supply digest through deploy/vm/up.py}
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=128m,mode=1777]
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 45s
    environment:
      KIONGA_CONFIG_FILE: /etc/kionga/config.json
      KIONGA_ENVIRONMENT: production
      DATABASE_URL_FILE: /run/secrets/DATABASE_URL
      OIDC_CLIENT_SECRET_FILE: /run/secrets/OIDC_CLIENT_SECRET
      MLAIOPS_INTERNAL_TOKEN_FILE: /run/secrets/MLAIOPS_INTERNAL_TOKEN
      KIONGA_CREDENTIAL_KEY_FILE: /run/secrets/KIONGA_CREDENTIAL_KEY
    volumes:
      - type: bind
        source: ${KIONGA_CONFIG_PATH}
        target: /etc/kionga/config.json
        read_only: true
        bind: {create_host_path: false}
    secrets: [DATABASE_URL, OIDC_CLIENT_SECRET, MLAIOPS_INTERNAL_TOKEN, KIONGA_CREDENTIAL_KEY]
    networks: [backend]
    # No host port. Caddy is the only public listener.
  caddy:
    image: ${KIONGA_CADDY_IMAGE:?supply digest through deploy/vm/up.py}
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      KIONGA_DOMAIN: ${KIONGA_DOMAIN}
      KIONGA_ACME_EMAIL: ${KIONGA_ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    networks: [backend]
    depends_on: [gateway]
networks:
  backend: {}
volumes:
  caddy-data: {}
  caddy-config: {}
secrets:
  DATABASE_URL: {file: '${KIONGA_SECRETS_DIR}/DATABASE_URL'}
  OIDC_CLIENT_SECRET: {file: '${KIONGA_SECRETS_DIR}/OIDC_CLIENT_SECRET'}
  MLAIOPS_INTERNAL_TOKEN: {file: '${KIONGA_SECRETS_DIR}/MLAIOPS_INTERNAL_TOKEN'}
  KIONGA_CREDENTIAL_KEY: {file: '${KIONGA_SECRETS_DIR}/KIONGA_CREDENTIAL_KEY'}
