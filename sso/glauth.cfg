# Development and test LDAP directory for single sign-on (GLAuth, MIT).
# Users sign in with password "kionga-sso-dev". Never use this file outside a
# local stack: point Dex at your real LDAP or Active Directory instead.
[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=kionga,dc=dev"
  nameformat = "cn"
  groupformat = "ou"

