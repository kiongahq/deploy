# Dex for the local single sign-on overlay (compose.sso.yaml). Dex expands
# $VARS from its environment. The browser reaches Dex at localhost:5556 and
# the gateway at dex:5556; both use the same issuer URL below.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true
  responseTypes: [code]

staticClients:
  - id: kionga
    name: Kionga
    secretEnv: DEX_KIONGA_CLIENT_SECRET
    redirectURIs:
      - http://localhost:8080/auth/callback

connectors:
  # LDAP / Active Directory. For AD use host: dc.example.com:636, userSearch
  # username: sAMAccountName, groupSearch filter (objectClass=group) and
  # groupAttr: member.
  - type: ldap
    id: ldap
    name: Company directory
    config:
      host: glauth:3893
      insecureNoSSL: true            # local test directory only; use TLS (636) in production
      bindDN: cn=dex,ou=svcaccts,dc=kionga,dc=dev
      bindPW: $DEX_LDAP_BIND_PASSWORD
      usernamePrompt: Username
      userSearch:
        baseDN: dc=kionga,dc=dev
        filter: "(objectClass=posixAccount)"
        username: cn
        idAttr: uidNumber
        emailAttr: mail
        nameAttr: cn
      groupSearch:                   # groups list members by DN (groupOfNames / groupOfUniqueNames)
        baseDN: ou=groups,dc=kionga,dc=dev
        filter: "(objectClass=groupOfUniqueNames)"
        userMatchers:
          - userAttr: DN
            groupAttr: uniqueMember
        nameAttr: ou

  # More connectors (uncomment and supply secrets through the environment):
  # - type: github     id: github   config: {clientID: $GITHUB_CLIENT_ID, clientSecret: $GITHUB_CLIENT_SECRET, redirectURI: http://localhost:5556/dex/callback, orgs: [{name: your-org}]}
  # - type: google     id: google   config: {clientID: ..., clientSecret: ..., redirectURI: ...}
  # - type: microsoft  id: entra    config: {clientID: ..., clientSecret: ..., tenant: <tenant-id>, redirectURI: ..., groups: [...]}
  # - type: saml       id: okta     config: {ssoURL: ..., ca: /etc/dex/saml-ca.pem, redirectURI: ..., usernameAttr: name, emailAttr: email, groupsAttr: groups}
  # - type: oidc       id: keycloak config: {issuer: https://keycloak.example/realms/x, clientID: ..., clientSecret: ..., redirectURI: ..., insecureEnableGroups: true}
