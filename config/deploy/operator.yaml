apiVersion: apps/v1
kind: Deployment
metadata:
  name: kionga-operator
  namespace: kionga-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: kionga-operator}
  template:
    metadata:
      labels: {app: kionga-operator}
    spec:
      serviceAccountName: kionga-operator
      containers:
        - name: operator
          image: ghcr.io/kiongahq/operator:latest
          args: [--leader-elect=true, --metrics-bind-address=:8080, --health-probe-bind-address=:8082]
          env:
            - {name: ENVIRONMENT, value: production}
            - {name: TRACE_PROXY_IMAGE, value: "ghcr.io/kiongahq/trace-proxy:latest"}
            - {name: KFP_URL, value: "http://ml-pipeline.kubeflow:8888"}
            - {name: MLFLOW_URL, value: "http://mlflow.kionga-system:5000"}
            - {name: KIONGA_URL, value: "http://kionga-gateway.kionga-system:8080"}
            - {name: WORKBENCH_IMAGE, value: "ghcr.io/kiongahq/jupyter:latest"}
            - {name: IDE_IMAGE, value: "ghcr.io/kiongahq/ide:latest"}
            - {name: WORKSPACE_FEATURE_URL, value: "http://kionga-feature-gateway.kionga-system:8083"}
            - {name: WORKSPACE_STORAGE_URL, value: "http://kionga-storage-proxy.kionga-system:8084"}
            - {name: WORKSPACE_MLFLOW_URL, value: "http://mlflow.kionga-system:5000"}
            - {name: WORKSPACE_PREFECT_URL, value: "http://prefect-server.kionga-system:4200/api"}
            - {name: WORKSPACE_LANGFUSE_URL, value: "http://langfuse.kionga-system:3000"}
            - {name: WORKSPACE_KAFKA_REST_URL, value: "http://kafka-rest.kionga-system:8082"}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8082}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
