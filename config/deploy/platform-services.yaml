apiVersion: v1
kind: Namespace
metadata:
  name: kionga-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kionga-gateway
  namespace: kionga-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: kionga-gateway}
  template:
    metadata:
      labels: {app: kionga-gateway}
    spec:
      serviceAccountName: kionga-gateway
      containers:
        - name: gateway
          image: ghcr.io/kiongahq/gateway:latest
          envFrom:
            - secretRef: {name: kionga-openfaas, optional: true}
          env:
            - {name: PORT, value: "8080"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: kionga-postgres, key: database-url}
            - {name: KIONGA_TENANT, value: default}
            - {name: KAFKA_REST_URL, value: "http://kafka-rest.kionga-system:8082"}
            - {name: KIONGA_AGENT_NAMESPACE, value: default}
            - {name: KIONGA_WORKSPACE_NAMESPACE, value: default}
            - {name: KIONGA_LANGFLOW_AGENT_IMAGE, value: "ghcr.io/kiongahq/langflow-agent-runtime:latest"}
            - {name: OIDC_ISSUER, value: "https://dex.example.com"}
            - {name: OIDC_AUDIENCE, value: kionga}
            - {name: OIDC_JWKS_URL, value: "https://dex.example.com/keys"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /api/v1/health, port: http}}
          livenessProbe: {httpGet: {path: /api/v1/health, port: http}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true}
---
apiVersion: v1
kind: Service
metadata:
  name: kionga-gateway
  namespace: kionga-system
spec:
  selector: {app: kionga-gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kionga-feature-gateway
  namespace: kionga-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: kionga-feature-gateway}
  template:
    metadata: {labels: {app: kionga-feature-gateway}}
    spec:
      containers:
        - name: feature-gateway
          image: ghcr.io/kiongahq/feature-gateway:latest
          ports: [{name: http, containerPort: 8083}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kionga-storage-proxy
  namespace: kionga-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: kionga-storage-proxy}
  template:
    metadata: {labels: {app: kionga-storage-proxy}}
    spec:
      containers:
        - name: storage-proxy
          image: ghcr.io/kiongahq/storage-proxy:latest
          envFrom: [{secretRef: {name: kionga-storage-credentials}}]
          ports: [{name: http, containerPort: 8084}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kionga-metrics-collector
  namespace: kionga-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: kionga-metrics-collector}
  template:
    metadata: {labels: {app: kionga-metrics-collector}}
    spec:
      containers:
        - name: collector
          image: ghcr.io/kiongahq/metrics-collector:latest
          ports: [{name: metrics, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /healthz, port: metrics}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
