
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kiongatools.kionga.dev
spec:
  group: kionga.dev
  scope: Namespaced
  names: {plural: kiongatools, singular: kiongatool, kind: KiongaTool, shortNames: [ktool]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [version, description, inputSchema]
              properties:
                version: {type: string}
                description: {type: string}
                tags: {type: array, items: {type: string}}
                inputSchema: {type: object, x-kubernetes-preserve-unknown-fields: true}
                endpoint: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                schemaHash: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kiongaconnections.kionga.dev
spec:
  group: kionga.dev
  scope: Namespaced
  names: {plural: kiongaconnections, singular: kiongaconnection, kind: KiongaConnection, shortNames: [kconn]}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [type, secretRef]
              properties:
                type: {type: string}
                endpoint: {type: string}
                secretRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                inferenceServiceRef: {type: string}
                checkedAt: {type: string, format: date-time}
