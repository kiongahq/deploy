apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kiongaagents.mlaiops.io
spec:
  group: mlaiops.io
  scope: Namespaced
  names:
    plural: kiongaagents
    singular: kiongaagent
    kind: KiongaAgent
    shortNames: [kagent]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image, graphModule, version, replicas]
              properties:
                version: {type: string, minLength: 1}
                image: {type: string, minLength: 1}
                graphModule: {type: string, minLength: 1}
                replicas:
                  type: object
                  required: [min, max]
                  x-kubernetes-validations:
                    - rule: self.max >= self.min
                      message: max replicas must be greater than or equal to min replicas
                  properties:
                    min: {type: integer, minimum: 1, maximum: 100}
                    max: {type: integer, minimum: 1, maximum: 100}
                llm:
                  type: object
                  properties:
                    backend: {type: string}
                    inferenceServiceRef: {type: string}
                tools:
                  type: array
                  items:
                    type: object
                    required: [name, version]
                    properties:
                      name: {type: string}
                      version: {type: string}
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      additionalProperties:
                        x-kubernetes-int-or-string: true
                        anyOf:
                          - type: integer
                          - type: string
                    limits:
                      type: object
                      additionalProperties:
                        x-kubernetes-int-or-string: true
                        anyOf:
                          - type: integer
                          - type: string
                langfuseProject: {type: string}
                trafficPolicy:
                  type: object
                  properties:
                    canaryWeight: {type: integer, minimum: 0, maximum: 100}
                    stableRef: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
                workloadRef: {type: string}
                readyReplicas: {type: integer}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
