apiVersion: v1
kind: ServiceAccount
metadata:
  name: kionga-operator
  namespace: kionga-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kionga-operator
rules:
  - apiGroups: [kionga.dev]
    resources: [kiongaagents, kiongaagents/status, kiongatools, kiongatools/status, kiongaconnections, kiongaconnections/status, kiongamodelpromotions, kiongamodelpromotions/status, kiongaworkspaces, kiongaworkspaces/status, kiongaapplications, kiongaapplications/status, kiongafunctions, kiongafunctions/status, kiongamodeldeployments, kiongamodeldeployments/status]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kionga.dev]
    resources: [kiongaapplications/finalizers, kiongafunctions/finalizers, kiongamodeldeployments/finalizers]
    verbs: [update]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [http.keda.sh]
    resources: [httpscaledobjects, interceptorroutes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims, secrets, configmaps, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.istio.io]
    resources: [virtualservices, destinationrules]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kionga-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kionga-operator
subjects:
  - kind: ServiceAccount
    name: kionga-operator
    namespace: kionga-system
