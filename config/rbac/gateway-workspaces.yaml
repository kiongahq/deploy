apiVersion: v1
kind: ServiceAccount
metadata:
  name: kionga-gateway
  namespace: kionga-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kionga-workspace-discovery
  namespace: default
rules:
  - apiGroups: [kionga.dev]
    resources: [kiongaworkspaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kionga-workspace-discovery
  namespace: default
subjects:
  - kind: ServiceAccount
    name: kionga-gateway
    namespace: kionga-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kionga-workspace-discovery
