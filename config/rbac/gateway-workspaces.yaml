apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlaiops-gateway
  namespace: mlaiops-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlaiops-workspace-discovery
  namespace: default
rules:
  - apiGroups: [mlaiops.io]
    resources: [kiongaworkspaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlaiops-workspace-discovery
  namespace: default
subjects:
  - kind: ServiceAccount
    name: mlaiops-gateway
    namespace: mlaiops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlaiops-workspace-discovery
