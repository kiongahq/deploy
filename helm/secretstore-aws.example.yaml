# Before applying: bind this ServiceAccount to a least-privileged IAM role (IRSA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kionga-secret-reader
  namespace: kionga-system
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/kionga-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kionga-store
  namespace: kionga-system
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_REGION
      auth:
        jwt:
          serviceAccountRef: {name: kionga-secret-reader}
