# Requires aws-ebs-csi-driver and its scoped IAM role. EBS is zonal and RWO.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kionga-ebs-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
