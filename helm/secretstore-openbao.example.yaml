# OpenBao as the External Secrets Operator store, applied by hand. Prefer
# secretStore.openbao.enabled in the chart, which renders the same objects.
# Use this file for an OpenBao you already run: replace the server, and give
# it the matching role (scripts/openbao-bootstrap.sh configure --addr URL
# creates kionga-platform for this ServiceAccount). OpenBao is MPL-2.0; ESO
# reaches it through its vault provider (KV v2, Kubernetes auth).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kionga-openbao-reader
  namespace: kionga-system
automountServiceAccountToken: false
---
# The CA that signed OpenBao's certificate (public). Omit with a public CA and
# drop caProvider below. scripts/openbao-bootstrap.sh ca --ca-out FILE writes it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kionga-openbao-ca
  namespace: kionga-system
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_THE_OPENBAO_CA
    -----END CERTIFICATE-----
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kionga-store
  namespace: kionga-system
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kionga
      version: v2
      caProvider: {type: ConfigMap, name: kionga-openbao-ca, key: ca.crt}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kionga-platform
          serviceAccountRef: {name: kionga-openbao-reader, audiences: [openbao]}
