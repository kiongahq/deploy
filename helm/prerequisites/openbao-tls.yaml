# TLS for OpenBao from cert-manager, applied by install.sh before the OpenBao
# chart. A private CA that lives only in the openbao namespace signs the server
# certificate. Clients (External Secrets Operator, the gateway) trust that CA:
# scripts/openbao-bootstrap.sh ca writes its public certificate to a file for
# the Kionga chart (secretStore.openbao.caBundle).
#
# The CA is valid for ten years and the server certificate for one year,
# renewed 30 days before it expires. OpenBao reads its certificate at start and
# on SIGHUP: after a renewal run `scripts/openbao-bootstrap.sh reload-tls`,
# which does not seal the servers.
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-selfsigned
  namespace: openbao
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca
  namespace: openbao
spec:
  isCA: true
  commonName: openbao-ca
  secretName: openbao-ca
  duration: 87600h
  renewBefore: 720h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Never}
  issuerRef: {kind: Issuer, name: openbao-selfsigned, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-ca
  namespace: openbao
spec:
  ca: {secretName: openbao-ca}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-server-tls
  namespace: openbao
spec:
  secretName: openbao-server-tls
  duration: 8760h
  renewBefore: 720h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  usages: [server auth, client auth, digital signature, key encipherment]
  # The Service, the active Service, every server through the headless
  # Service (Raft joins use it), and loopback for the CLI inside each pod.
  dnsNames:
    - openbao
    - openbao.openbao
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - openbao-active.openbao.svc
    - openbao-active.openbao.svc.cluster.local
    - openbao-internal
    - "*.openbao-internal"
    - "*.openbao-internal.openbao.svc"
    - "*.openbao-internal.openbao.svc.cluster.local"
    - localhost
  ipAddresses: [127.0.0.1]
  issuerRef: {kind: Issuer, name: openbao-ca, group: cert-manager.io}
