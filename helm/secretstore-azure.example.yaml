apiVersion: v1
kind: ServiceAccount
metadata:
  name: kionga-secret-reader
  namespace: kionga-system
  annotations:
    azure.workload.identity/client-id: MANAGED_IDENTITY_CLIENT_ID
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kionga-store
  namespace: kionga-system
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://VAULT_NAME.vault.azure.net
      serviceAccountRef: {name: kionga-secret-reader}
