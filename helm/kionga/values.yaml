# Supply immutable images and real non-secret endpoint configuration in an overlay.
# Infrastructure engines/databases are prerequisites, not silently installed demos.
workspaceNamespace: kionga-workloads
storageClass: ""
# Registry credentials for private images, e.g. [{name: ghcr-pull}]. Create the
# kubernetes.io/dockerconfigjson Secret in the release namespace (platform pods)
# and in workspaceNamespace (workspace and agent pods the operator creates).
imagePullSecrets: []
images:
  gateway: ""
  operator: ""
  integration-worker: ""
  feature-gateway: ""
  storage-proxy: ""
  trace-proxy: ""
  jupyter: ""
  ide: ""
  langflow: ""
  langflow-sidecar: ""
  langflow-agent-runtime: ""
  # agent-runtime: runs deployed native Agent Designer versions and the
  # designer runner.
  agent-runtime: ""
config:
  KIONGA_ENVIRONMENT: production
  OIDC_ISSUER: ""
  OIDC_JWKS_URL: ""
  OIDC_AUDIENCE: kionga
  OIDC_CLIENT_ID: kionga
  OIDC_AUTH_URL: ""
  OIDC_TOKEN_URL: ""
  OIDC_REDIRECT_URL: ""
  KIONGA_ALLOWED_ORIGIN: ""
  KAFKA_REST_URL: ""
  MLFLOW_URL: ""
  PREFECT_API_URL: ""
  S3_ENDPOINT: ""
  S3_REGION: us-east-1
  KIONGA_TRUSTED_WORKSPACE_PROXY: "false"
  KIONGA_WORKSPACE_BASE_DOMAIN: ""
# Secret objects are created outside Helm, manually or through External Secrets.
secretNames:
  gateway: kionga-gateway
  operator: kionga-operator
  integration-worker: kionga-worker
  feature-gateway: kionga-features
  storage-proxy: kionga-storage
  trace-proxy: kionga-tracing
# Each component also accepts extraEnv: a list of Kubernetes EnvVar entries
# added to its container. Use valueFrom.secretKeyRef for credentials (never put
# secret values in values files), for example external storage secret_ref
# variables on the gateway:
#   gateway:
#     extraEnv:
#       - name: TENANT_A_STORAGE
#         valueFrom: {secretKeyRef: {name: tenant-a-storage, key: credentials}}
components:
  gateway:
    replicas: 3
    port: 8080
    health: /api/v1/health
    ready: /api/v1/ready
    secrets: [DATABASE_URL, OIDC_CLIENT_SECRET, KIONGA_INTERNAL_TOKEN, KIONGA_CREDENTIAL_KEY]
  operator:
    replicas: 2
    port: 8082
    health: /healthz
    ready: /readyz
    secrets: []
  integration-worker:
    replicas: 2
    port: 8086
    health: /healthz
    ready: /readyz
    secrets: []
  feature-gateway:
    replicas: 2
    port: 8083
    health: /healthz
    ready: /healthz
    secrets: [REDIS_URL, KIONGA_INTERNAL_TOKEN]
  storage-proxy:
    replicas: 2
    port: 8084
    health: /healthz
    ready: /healthz
    secrets: [S3_ACCESS_KEY, S3_SECRET_KEY, KIONGA_INTERNAL_TOKEN]
  trace-proxy:
    replicas: 2
    port: 8081
    health: /healthz
    ready: /healthz
    # Create key TRACE_PROXY_KEYS in secretNames.trace-proxy: a JSON array of
    # {key_id, key_sha256, project, agent}. Only hashes are stored; the proxy does
    # not start without it. For a hosted provider, also create key
    # LLM_UPSTREAM_API_KEY and set this list to
    # [TRACE_PROXY_KEYS, LLM_UPSTREAM_API_KEY]; set config.LLM_UPSTREAM_AUTH_HEADER
    # and config.LLM_UPSTREAM_AUTH_SCHEME when it does not use Authorization: Bearer.
    # config.TRACE_PROXY_WRITE_TIMEOUT_SECONDS sets the total time for one response,
    # stream included (1 to 3600, default 660). Keep it above your callers' timeouts.
    secrets: [TRACE_PROXY_KEYS]
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
ingress:
  enabled: true
  className: ""
  host: ""
  tlsSecretName: kionga-tls
  annotations: {}
  controllerNamespace: ingress-system
workspaceIngress:
  enabled: false
  baseDomain: ""
  tlsSecretName: kionga-workspace-tls
  annotations: {}
monitoring:
  enabled: false
  namespace: monitoring
  selectorLabels: {release: prometheus}
gatewayAutoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  cpuPercent: 70
# Native Agent Designer playground and evaluation runner. Off by default. To
# enable it, create the Secret named by secretName with keys
# KIONGA_DESIGNER_RUNNER_TOKEN (32+ random characters, or through
# externalSecrets.targets), which the gateway and the runner both mount, and
# TRACE_PROXY_PROJECT_KEY, a project key whose hash is in the trace-proxy's
# TRACE_PROXY_KEYS. Model calls go through the release's trace-proxy.
agentDesigner:
  enabled: false
  replicas: 2
  maxRuns: 8
  secretName: kionga-agent-designer
  llm:
    backend: openai-compatible
    model: ""
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 1Gi}
# Agent team sandboxes. Off by default; while off, sandbox tools report
# sandbox_unavailable and everything else works. To enable it:
#   - install gVisor on the nodes and name its RuntimeClass below;
#   - create the Secret named by secretName with key KIONGA_SANDBOX_TOKEN (32+
#     random characters), which the gateway and the manager both read;
#   - list the API server addresses in kubernetesApiCidrs, including the
#     `kubernetes` Service ClusterIP and any public endpoint.
# The chart has no setting for the unsafe runtime flag, and refuses one.
sandbox:
  enabled: false
  replicas: 2
  # The manager image, sandbox-manager, as repository@sha256:digest.
  image: ""
  # The only namespace the manager can write to, and where sandboxes run.
  namespace: kionga-sandboxes
  secretName: kionga-sandbox
  runtimeClassName: gvisor
  # Create the RuntimeClass too. Leave false when the provider supplies it.
  createRuntimeClass: false
  runtimeClassHandler: runsc
  # Images sandboxes may use, each as repository@sha256:digest.
  images: []
  # Hosts git may reach over HTTPS. Empty: git tools are refused and git helper
  # pods get no egress policy.
  gitHosts: []
  ttlSeconds: 86400
  # IPv4 CIDRs of the API server. The manager may reach them; git helpers may not.
  kubernetesApiCidrs: []
  # Other IPv4 ranges git helpers must not reach, for a cluster whose pod, Service
  # or node ranges fall outside the private ranges, which are always denied along
  # with the 169.254.0.0/16 metadata range.
  internalCidrs: []
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}
# Agent team tuning for the gateway. Teams also need agentDesigner.enabled. Empty uses
# the gateway's default. scheduler can only be off, which applies to every replica.
agentTeams:
  turnTimeoutSeconds: ""
  compactThresholdTokens: ""
  workerPool: ""
  sandboxRetentionSeconds: ""
  scheduler: ""
# Credentials that knowledge bases, API connections, feature stores, storage
# connections and platform connections reference as env:NAME. Create secretName with
# one key per name below; the gateway reads each through secretKeyRef.
# names: KIONGA_{KB,CONNECTION,FEATURE,STORAGE,PLATFORM}_SECRET_*, KIONGA_QDRANT_KEY,
# KIONGA_KNOWLEDGE_DSN, KIONGA_AGENT_API_TOKEN, FEAST_TOKEN, LAKE_CREDENTIALS,
# OPENFAAS_PASSWORD, MLFLOW_TOKEN, KFP_TOKEN, or a name in an allowlist.
# The allowlists keep a stored reference under another name.
secretReferences:
  secretName: kionga-secret-references
  names: []
  knowledgeAllowlist: []
  connectionAllowlist: []
  featureAllowlist: []
  storageAllowlist: []
  platformAllowlist: []
networkPolicy:
  enabled: true
  # Explicit destination CIDRs/ports for DB, IdP, Kafka REST, engines, object
  # storage, and Kubernetes API. Empty denies external traffic (DNS excepted).
  externalEgress: []
workspaceQuota:
  requests.cpu: "64"
  requests.memory: 128Gi
  requests.storage: 2Ti
  pods: "100"
  persistentvolumeclaims: "100"
externalSecrets:
  enabled: false
  storeName: kionga-store
  storeKind: SecretStore
  # name -> list of {secretKey: DATABASE_URL, remoteRef: {key: path, property: field}}
  targets: {}

# Run container pipeline nodes as Kubernetes Jobs from the gateway instead of
# the Compose pipeline runner. Requires the namespace to exist (with your
# NetworkPolicy and resource quota). Implemented and tested against the
# Kubernetes API fake; not yet validated on a live cluster.
pipelineExecutor:
  kubernetes: false
  namespace: kionga-pipelines

# A private certificate authority the platform components trust in addition to
# the system roots, for PostgreSQL with sslmode=verify-full, an internal
# identity provider or object store. A ConfigMap in the release namespace with
# the PEM bundle under key. Empty: system roots only.
trustedCA:
  configMapName: ""
  key: ca.crt

# Kionga's own CustomResourceDefinitions (config/crd), rendered from
# files/crds. They carry helm.sh/resource-policy: keep, so uninstalling the
# release never deletes them or the resources users created. Set false when you
# apply config/crd yourself; the preflight then requires them to exist. CRDs
# applied earlier with kubectl must be adopted once before the first install
# with this on (see README, "Kubernetes CRDs").
crds:
  install: true

# Refuse to install when a cluster prerequisite is missing. On a live
# install or upgrade the chart reads the cluster's API groups and names the
# first missing CRD. `helm template` cannot see a cluster, so it skips the
# check unless enforceOffline is true; then the API groups come from
# --api-versions (as Argo CD passes them).
preflight:
  enabled: true
  enforceOffline: false

# Applications: user software services reachable at <name>.<baseDomain>, each a
# KiongaApplication that the operator turns into a Deployment, Service, Ingress,
# PodDisruptionBudget and KEDA scaling objects in workspaceNamespace. Needs
# keda.enabled and cert-manager when tls.clusterIssuer is set. Install the
# prerequisites with helm/prerequisites/install.sh.
applications:
  enabled: false
  # DNS zone for applications, e.g. apps.example.com: billing.apps.example.com.
  # Point a wildcard DNS record at your ingress controller. It must differ from
  # ingress.host and workspaceIngress.baseDomain.
  baseDomain: ""
  tls:
    # A cert-manager ClusterIssuer that can solve DNS-01 for *.<baseDomain>
    # (HTTP-01 cannot issue wildcards). The chart then creates the wildcard
    # Certificate in the release and workload namespaces. Leave empty to supply
    # your own kubernetes.io/tls Secret named secretName in both namespaces.
    clusterIssuer: ""
    secretName: kionga-applications-tls
  # Annotations on the per-application Ingresses the operator creates.
  ingressAnnotations: {}
  # A wildcard Ingress for *.<baseDomain> that sends hosts without an
  # application to the gateway, which answers "not found" or "starting". Give it
  # the lowest priority your controller supports so it never shadows an
  # application, e.g. traefik.ingress.kubernetes.io/router.priority: "1".
  fallbackIngress:
    enabled: true
    annotations: {}
  # Source builds (spec.source). Empty url disables them; image deployments still work.
  registry:
    # Repository prefix the build pushes to, e.g. registry.example.com/kionga-apps.
    url: ""
    # kubernetes.io/dockerconfigjson Secret in workspaceNamespace with push access.
    # The operator also lists it as an image pull secret for built images.
    pushSecretName: ""
    # Plain-HTTP registry, for a cluster-local registry only.
    insecure: false
  build:
    # Builds run as Jobs in workspaceNamespace. Rootless BuildKit needs an
    # unconfined seccomp profile, so with registry.url set the chart enforces the
    # privileged Pod Security level there (restricted is still warned and
    # audited). Build pods may reach DNS, public HTTPS/HTTP and extraEgress.
    # Egress rules for a registry or git server on a private network.
    extraEgress: []
    # Rootless BuildKit, pinned by digest.
    image: moby/buildkit:v0.34.1-rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
    timeoutSeconds: 1800
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "2", memory: 4Gi}
  # Egress rules (NetworkPolicy egress entries) for application and function
  # pods beyond DNS and the Kionga services. Empty: they reach nothing else.
  extraEgress: []

# Functions on Kubernetes are Kionga-native (no OpenFaaS): KiongaFunction
# objects that scale to zero on requests through the KEDA HTTP add-on and are
# invoked through the gateway. Needs keda.enabled.
functions:
  enabled: false
  # Seconds without requests before a function scales to zero.
  scaleDownSeconds: 300
  defaultMaxReplicas: 10

# KEDA core and the KEDA HTTP add-on: request-based scaling and scale to zero
# for applications, functions and agents. CPU autoscaling stays the fallback.
keda:
  enabled: false
  namespace: keda
  interceptor:
    # The HTTP add-on's proxy Service in keda.namespace and its port.
    service: keda-add-ons-http-interceptor-proxy
    port: 8080
    # Labels on the interceptor pods, allowed through application NetworkPolicies.
    podLabels: {app.kubernetes.io/component: interceptor, app.kubernetes.io/name: http-add-on}

# KServe in raw (Standard) mode for model endpoints (KiongaModelDeployment).
kserve:
  enabled: false
  # RawDeployment (the operator's default) and Standard both mean plain
  # Deployments with no Knative; KServe 0.21 accepts either.
  deploymentMode: RawDeployment
  # Secret in workspaceNamespace with the object store credentials model servers
  # read artifacts with (keys AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY). Use a
  # read-only identity.
  storageSecretName: kionga-model-storage
  # Object store the model servers read from. Empty endpoint: AWS S3.
  storage:
    endpoint: ""          # host:port, e.g. objectstore.internal:9000
    useHTTPS: true
    region: ""            # default us-east-1
    # The bucket behind MLflow's artifact proxy, e.g. s3://kionga-models, when
    # MLflow serves artifacts itself (mlflow-artifacts:/ URIs).
    artifactsDestination: ""
  # Egress rules for predictor pods to reach the object store, e.g.
  # [{to: [{ipBlock: {cidr: 10.0.40.0/24}}], ports: [{port: 443}]}].
  storageEgress: []

# Public marketing site the console links to. Empty: no link.
website:
  url: ""

# Blog authoring in the console (editorial workspace). Off by default: the blog
# lives on the marketing site.
blog:
  authoringEnabled: false

# Managed operations: lets the Kionga operations team operate this install in
# your cluster. Off by default. Creates a ServiceAccount plus Roles in every
# Kionga namespace and a small read-only ClusterRole, all labelled
# kionga.dev/access=operations so `kubectl get rolebindings,clusterrolebindings
# -A -l kionga.dev/access=operations` lists every grant. Read access to Kionga
# objects, logs and events; restart and roll out Kionga Deployments. No Secret
# access unless allowSecretRead, and never exec or port-forward.
operations:
  access:
    enabled: false
    # Identities from your identity provider, as RBAC subjects, e.g.
    # [{kind: Group, name: kionga-operations}, {kind: User, name: ops@kionga.dev}].
    subjects: []
    serviceAccount:
      create: true
      name: kionga-operations
    allowSecretRead: false
