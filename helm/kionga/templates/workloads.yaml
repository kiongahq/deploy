{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
automountServiceAccountToken: {{ has $name (list "gateway" "operator" "integration-worker") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
spec:
  {{- if not (and (eq $name "gateway") $.Values.gatewayAutoscaling.enabled) }}
  replicas: {{ $component.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
      annotations:
        checksum/config: {{ $.Values.config | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $name }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
      containers:
        - name: {{ $name }}
          image: {{ index $.Values.images $name | quote }}
          imagePullPolicy: IfNotPresent
          {{- if eq $name "operator" }}
          args: [--leader-elect=true, --health-probe-bind-address=:8082]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml (default $.Values.resources $component.resources) | nindent 12 }}
          env:
            - {name: KIONGA_CONFIG_FILE, value: /etc/kionga/config.json}
            - {name: PORT, value: {{ $component.port | quote }}}
            {{- if eq $name "gateway" }}
            - {name: METRICS_PORT, value: "9090"}
            {{- end }}
            - {name: MLAIOPS_TARGET_NAMESPACE, value: {{ $.Values.workspaceNamespace | quote }}}
            - {name: MLAIOPS_CONTROL_NAMESPACE, value: {{ $.Release.Namespace | quote }}}
            - {name: MLAIOPS_AGENT_NAMESPACE, value: {{ $.Values.workspaceNamespace | quote }}}
            - {name: KIONGA_WORKSPACE_NAMESPACE, value: {{ $.Values.workspaceNamespace | quote }}}
            - {name: WORKSPACE_STORAGE_CLASS, value: {{ $.Values.storageClass | quote }}}
            - {name: MLAIOPS_URL, value: "http://{{ $.Release.Name }}-gateway.{{ $.Release.Namespace }}.svc:8080"}
            {{- if and (eq $name "gateway") $.Values.pipelineExecutor.kubernetes }}
            - {name: KIONGA_EXECUTOR, value: kubernetes}
            - {name: KIONGA_K8S_NAMESPACE, value: {{ $.Values.pipelineExecutor.namespace | quote }}}
            {{- end }}
            - {name: TRACE_PROXY_IMAGE, value: {{ index $.Values.images "trace-proxy" | quote }}}
            - {name: WORKBENCH_IMAGE, value: {{ $.Values.images.jupyter | quote }}}
            - {name: IDE_IMAGE, value: {{ $.Values.images.ide | quote }}}
            {{- range $component.secrets }}
            - {name: {{ . }}_FILE, value: /run/secrets/{{ . }}}
            {{- end }}
          {{- if $component.port }}
          {{- if eq $name "gateway" }}
          ports: [{name: http, containerPort: {{ $component.port }}}, {name: metrics, containerPort: 9090}]
          {{- else if eq $name "operator" }}
          ports: [{name: http, containerPort: {{ $component.port }}}, {name: metrics, containerPort: 8080}]
          {{- else }}
          ports: [{name: http, containerPort: {{ $component.port }}}]
          {{- end }}
          startupProbe:
            httpGet: {path: {{ $component.health }}, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ $component.ready }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: {{ $component.health }}, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          {{- end }}
          volumeMounts:
            - {name: config, mountPath: /etc/kionga, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $component.secrets }}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $.Release.Name }}-config}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        {{- if $component.secrets }}
        - name: secrets
          secret:
            secretName: {{ index $.Values.secretNames $name }}
            defaultMode: 0440
            items:
              {{- range $component.secrets }}
              - {key: {{ . }}, path: {{ . }}}
              {{- end }}
        {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
{{- if $component.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
  {{- if eq $name "gateway" }}
  ports: [{name: http, port: {{ $component.port }}, targetPort: http}, {name: metrics, port: 9090, targetPort: metrics}]
  {{- else if eq $name "operator" }}
  ports: [{name: http, port: {{ $component.port }}, targetPort: http}, {name: metrics, port: 8080, targetPort: metrics}]
  {{- else }}
  ports: [{name: http, port: {{ $component.port }}, targetPort: http}]
  {{- end }}
{{- end }}
{{- end }}
