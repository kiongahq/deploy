{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
automountServiceAccountToken: {{ has $name (list "gateway" "operator" "integration-worker") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
spec:
  {{- if not (and (eq $name "gateway") $.Values.gatewayAutoscaling.enabled) }}
  replicas: {{ $component.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
      annotations:
        checksum/config: {{ $.Values.config | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $.Release.Name }}-{{ $name }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
      containers:
        - name: {{ $name }}
          image: {{ index $.Values.images $name | quote }}
          imagePullPolicy: IfNotPresent
          {{- if eq $name "operator" }}
          args: [--leader-elect=true, --health-probe-bind-address=:8082]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ toYaml (default $.Values.resources $component.resources) | nindent 12 }}
          env:
            - {name: KIONGA_CONFIG_FILE, value: /etc/kionga/config.json}
            - {name: PORT, value: {{ $component.port | quote }}}
            {{- if eq $name "gateway" }}
            - {name: METRICS_PORT, value: "9090"}
            {{- end }}
            - {name: MLAIOPS_TARGET_NAMESPACE, value: {{ $.Values.workspaceNamespace | quote }}}
            - {name: MLAIOPS_CONTROL_NAMESPACE, value: {{ $.Release.Namespace | quote }}}
            - {name: MLAIOPS_AGENT_NAMESPACE, value: {{ $.Values.workspaceNamespace | quote }}}
            - {name: KIONGA_WORKSPACE_NAMESPACE, value: {{ $.Values.workspaceNamespace | quote }}}
            - {name: WORKSPACE_STORAGE_CLASS, value: {{ $.Values.storageClass | quote }}}
            - {name: MLAIOPS_URL, value: "http://{{ $.Release.Name }}-gateway.{{ $.Release.Namespace }}.svc:8080"}
            {{- if and (eq $name "gateway") $.Values.pipelineExecutor.kubernetes }}
            - {name: KIONGA_EXECUTOR, value: kubernetes}
            - {name: KIONGA_K8S_NAMESPACE, value: {{ $.Values.pipelineExecutor.namespace | quote }}}
            {{- end }}
            - {name: TRACE_PROXY_IMAGE, value: {{ index $.Values.images "trace-proxy" | quote }}}
            - {name: WORKBENCH_IMAGE, value: {{ $.Values.images.jupyter | quote }}}
            - {name: IDE_IMAGE, value: {{ $.Values.images.ide | quote }}}
            - {name: LANGFLOW_IMAGE, value: {{ $.Values.images.langflow | quote }}}
            - {name: LANGFLOW_SIDECAR_IMAGE, value: {{ index $.Values.images "langflow-sidecar" | quote }}}
            - {name: KIONGA_LANGFLOW_AGENT_IMAGE, value: {{ index $.Values.images "langflow-agent-runtime" | quote }}}
            {{- if eq $name "gateway" }}
            - {name: KIONGA_NATIVE_AGENT_IMAGE, value: {{ index $.Values.images "agent-runtime" | quote }}}
            {{- if $.Values.agentDesigner.enabled }}
            - {name: KIONGA_AGENT_DESIGNER_RUNNER_URL, value: "http://{{ $.Release.Name }}-agent-designer-runner.{{ $.Release.Namespace }}.svc:9100"}
            - {name: KIONGA_AGENT_DESIGNER_CALLBACK_URL, value: "http://{{ $.Release.Name }}-gateway.{{ $.Release.Namespace }}.svc:8087/api/v1"}
            - {name: KIONGA_AGENT_DESIGNER_RUNNER_TOKEN_FILE, value: /run/designer/KIONGA_DESIGNER_RUNNER_TOKEN}
            {{- end }}
            {{- with $.Values.agentTeams }}
            {{- if .turnTimeoutSeconds }}
            - {name: KIONGA_AGENT_TURN_TIMEOUT_SECONDS, value: {{ .turnTimeoutSeconds | quote }}}
            {{- end }}
            {{- if .compactThresholdTokens }}
            - {name: KIONGA_TEAM_COMPACT_THRESHOLD_TOKENS, value: {{ .compactThresholdTokens | quote }}}
            {{- end }}
            {{- if .workerPool }}
            - {name: KIONGA_TEAM_WORKER_POOL, value: {{ .workerPool | quote }}}
            {{- end }}
            {{- if .sandboxRetentionSeconds }}
            - {name: KIONGA_TEAM_SANDBOX_RETENTION_SECONDS, value: {{ .sandboxRetentionSeconds | quote }}}
            {{- end }}
            {{- if .scheduler }}
            {{- if ne .scheduler "off" }}{{ fail "agentTeams.scheduler can only be off" }}{{ end }}
            - {name: KIONGA_TEAM_SCHEDULER, value: "off"}
            {{- end }}
            {{- end }}
            {{- with $.Values.secretReferences }}
            {{- $refs := . }}
            {{- /* The gateway refuses these at resolve time; stop here rather than overwrite one. */ -}}
            {{- $exempt := list "OPENFAAS_PASSWORD" "MLFLOW_TOKEN" "KFP_TOKEN" }}
            {{- $own := concat $exempt (list "DATABASE_URL" "OIDC_CLIENT_SECRET" "MLAIOPS_INTERNAL_TOKEN" "KIONGA_CREDENTIAL_KEY" "S3_ACCESS_KEY" "S3_SECRET_KEY" "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" "REDIS_URL" "KAFKA_REST_TOKEN" "LANGFUSE_SECRET_KEY" "OPENAI_API_KEY" "ANTHROPIC_API_KEY" "LLM_UPSTREAM_API_KEY" "KIONGA_JUPYTER_TOKEN" "KIONGA_IDE_PASSWORD" "TRACE_SINK_TOKEN" "MLAIOPS_LOCAL_PASSWORD" "KIONGA_AGENT_DESIGNER_RUNNER_TOKEN" "KIONGA_DESIGNER_RUNNER_TOKEN" "KIONGA_SANDBOX_TOKEN" "KIONGA_KB_SECRET_REFS" "KIONGA_CONNECTION_SECRET_REFS" "KIONGA_FEATURE_SECRET_REFS" "KIONGA_STORAGE_SECRET_REFS" "KIONGA_PLATFORM_SECRET_REFS") }}
            {{- $allowed := concat .knowledgeAllowlist .connectionAllowlist .featureAllowlist .storageAllowlist .platformAllowlist }}
            {{- range $allowed }}
            {{- if has . $own }}{{ fail (printf "secretReferences cannot name %s" .) }}{{ end }}
            {{- end }}
            {{- range $name, $list := dict "KIONGA_KB_SECRET_REFS" .knowledgeAllowlist "KIONGA_CONNECTION_SECRET_REFS" .connectionAllowlist "KIONGA_FEATURE_SECRET_REFS" .featureAllowlist "KIONGA_STORAGE_SECRET_REFS" .storageAllowlist "KIONGA_PLATFORM_SECRET_REFS" .platformAllowlist }}
            {{- if $list }}
            - {name: {{ $name }}, value: {{ join "," $list | quote }}}
            {{- end }}
            {{- end }}
            {{- range .names }}
            {{- if and (has . $own) (not (has . $exempt)) }}{{ fail (printf "secretReferences cannot name %s" .) }}{{ end }}
            {{- if not (or (hasPrefix "KIONGA_KB_SECRET_" .) (hasPrefix "KIONGA_CONNECTION_SECRET_" .) (hasPrefix "KIONGA_FEATURE_SECRET_" .) (hasPrefix "KIONGA_STORAGE_SECRET_" .) (hasPrefix "KIONGA_PLATFORM_SECRET_" .) (has . $exempt) (has . (list "KIONGA_QDRANT_KEY" "KIONGA_KNOWLEDGE_DSN" "KIONGA_AGENT_API_TOKEN" "FEAST_TOKEN" "LAKE_CREDENTIALS")) (has . $allowed)) }}
            {{- fail (printf "secretReferences.names: %s needs a scope prefix such as KIONGA_KB_SECRET_, or an allowlist entry" .) }}
            {{- end }}
            - name: {{ . }}
              valueFrom: {secretKeyRef: {name: {{ $refs.secretName }}, key: {{ . }}}}
            {{- end }}
            {{- end }}
            {{- if $.Values.sandbox.enabled }}
            - {name: KIONGA_SANDBOX_URL, value: "http://{{ $.Release.Name }}-sandbox-manager.{{ $.Release.Namespace }}.svc:8088"}
            - name: KIONGA_SANDBOX_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $.Values.sandbox.secretName }}, key: KIONGA_SANDBOX_TOKEN}}
            {{- end }}
            {{- end }}
            {{- if and (eq $name "operator") $.Values.imagePullSecrets }}
            {{- $pullSecrets := list }}
            {{- range $.Values.imagePullSecrets }}{{ $pullSecrets = append $pullSecrets .name }}{{ end }}
            # Workspace and agent pods in workspaceNamespace reference the same
            # Secret names; create the Secrets there too.
            - {name: KIONGA_IMAGE_PULL_SECRETS, value: {{ join "," $pullSecrets | quote }}}
            {{- end }}
            {{- range $component.secrets }}
            - {name: {{ . }}_FILE, value: /run/secrets/{{ . }}}
            {{- end }}
            {{- with $component.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $component.port }}
          {{- if eq $name "gateway" }}
          ports: [{name: http, containerPort: {{ $component.port }}}, {name: metrics, containerPort: 9090}, {name: workspace-api, containerPort: 8087}]
          {{- else if eq $name "operator" }}
          ports: [{name: http, containerPort: {{ $component.port }}}, {name: metrics, containerPort: 8080}]
          {{- else }}
          ports: [{name: http, containerPort: {{ $component.port }}}]
          {{- end }}
          startupProbe:
            httpGet: {path: {{ $component.health }}, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ $component.ready }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: {{ $component.health }}, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          {{- end }}
          volumeMounts:
            - {name: config, mountPath: /etc/kionga, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $component.secrets }}
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            {{- end }}
            {{- if and (eq $name "gateway") $.Values.agentDesigner.enabled }}
            - {name: designer-token, mountPath: /run/designer, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $.Release.Name }}-config}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        {{- if and (eq $name "gateway") $.Values.agentDesigner.enabled }}
        - name: designer-token
          secret:
            secretName: {{ $.Values.agentDesigner.secretName }}
            defaultMode: 0440
            items: [{key: KIONGA_DESIGNER_RUNNER_TOKEN, path: KIONGA_DESIGNER_RUNNER_TOKEN}]
        {{- end }}
        {{- if $component.secrets }}
        - name: secrets
          secret:
            secretName: {{ index $.Values.secretNames $name }}
            defaultMode: 0440
            items:
              {{- range $component.secrets }}
              - {key: {{ . }}, path: {{ . }}}
              {{- end }}
        {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
{{- if $component.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}}
  {{- if eq $name "gateway" }}
  ports: [{name: http, port: {{ $component.port }}, targetPort: http}, {name: metrics, port: 9090, targetPort: metrics}, {name: workspace-api, port: 8087, targetPort: workspace-api}]
  {{- else if eq $name "operator" }}
  ports: [{name: http, port: {{ $component.port }}, targetPort: http}, {name: metrics, port: 8080, targetPort: metrics}]
  {{- else }}
  ports: [{name: http, port: {{ $component.port }}, targetPort: http}]
  {{- end }}
{{- end }}
{{- end }}
