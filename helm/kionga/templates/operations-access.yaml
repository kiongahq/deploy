{{- /*
Managed operations: the Kionga operations team operates this install inside the
customer's cluster. Off by default. Every object carries
kionga.dev/access=operations so one command lists the whole grant:
  kubectl get serviceaccounts,roles,rolebindings,clusterroles,clusterrolebindings -A -l kionga.dev/access=operations
Grants: read Kionga's objects, logs and events in Kionga's namespaces; restart
and roll out Kionga Deployments (patch and the scale subresource) and delete a
Pod so its controller replaces it. Never Secrets unless allowSecretRead, never
exec, attach, port-forward, impersonation or RBAC changes. The ClusterRole only
reads nodes, namespaces, storage and ingress classes and the CRDs Kionga uses.
*/ -}}
{{- $ops := .Values.operations.access }}
{{- if $ops.enabled }}
{{- if and (not $ops.subjects) (not $ops.serviceAccount.create) }}{{ fail "operations.access needs subjects or serviceAccount.create" }}{{ end }}
{{- range $ops.subjects }}
{{- if not (has .kind (list "User" "Group")) }}{{ fail "operations.access.subjects entries must be kind User or Group (identities from your identity provider)" }}{{ end }}
{{- if not .name }}{{ fail "operations.access.subjects entries need a name" }}{{ end }}
{{- end }}
{{- $labels := dict "app.kubernetes.io/part-of" "kionga" "kionga.dev/release" .Release.Name "kionga.dev/access" "operations" }}
{{- $annotations := dict "kionga.dev/purpose" "Kionga managed operations access; remove by setting operations.access.enabled=false" }}
{{- $name := printf "%s-operations" .Release.Name }}
{{- $subjects := list }}
{{- range $ops.subjects }}
{{- $subjects = append $subjects (dict "kind" .kind "name" .name "apiGroup" "rbac.authorization.k8s.io") }}
{{- end }}
{{- if $ops.serviceAccount.create }}
{{- $subjects = append $subjects (dict "kind" "ServiceAccount" "name" $ops.serviceAccount.name "namespace" .Release.Namespace) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $ops.serviceAccount.name }}
  labels: {{ toYaml $labels | nindent 4 }}
  annotations: {{ toYaml $annotations | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- $namespaces := list .Release.Namespace .Values.workspaceNamespace }}
{{- if .Values.pipelineExecutor.kubernetes }}{{ $namespaces = append $namespaces .Values.pipelineExecutor.namespace }}{{ end }}
{{- if .Values.sandbox.enabled }}{{ $namespaces = append $namespaces .Values.sandbox.namespace }}{{ end }}
{{- if and .Values.applications.enabled .Values.applications.registry.url }}{{ $namespaces = append $namespaces .Values.applications.build.namespace }}{{ end }}
{{- range $namespace := uniq $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels: {{ toYaml $labels | nindent 4 }}
  annotations: {{ toYaml $annotations | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, configmaps, persistentvolumeclaims, serviceaccounts, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [kionga.dev]
    resources: [kiongaapplications, kiongafunctions, kiongamodeldeployments, kiongaagents, kiongaworkspaces, kiongapipelineruns,
                kiongamodelpromotions, kiongatools, kiongaconnections]
    verbs: [get, list, watch]
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch]
  - apiGroups: [http.keda.sh]
    resources: [httpscaledobjects, interceptorroutes]
    verbs: [get, list, watch]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  # Restart and roll out: `kubectl rollout restart` patches the template,
  # `kubectl scale` uses the subresource, a deleted Pod is recreated.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  {{- if $ops.allowSecretRead }}
  # operations.access.allowSecretRead: granted explicitly by the customer.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels: {{ toYaml $labels | nindent 4 }}
  annotations: {{ toYaml $annotations | nindent 4 }}
subjects: {{ toYaml $subjects | nindent 2 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels: {{ toYaml $labels | nindent 4 }}
  annotations: {{ toYaml $annotations | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [clusterissuers]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels: {{ toYaml $labels | nindent 4 }}
  annotations: {{ toYaml $annotations | nindent 4 }}
subjects: {{ toYaml $subjects | nindent 2 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}}
{{- end }}
