{{- /*
OpenBao as the External Secrets Operator store (secretStore.openbao). ESO's
vault provider talks to OpenBao: KV v2 under `path`, Kubernetes auth with a
token ESO requests for the reader ServiceAccount below (audience
auth.audience). scripts/openbao-bootstrap.sh creates the matching roles:
<release>-platform for the release namespace and <release>-workspace for
workspaceNamespace, each reading only its own paths.
*/ -}}
{{- $o := .Values.secretStore.openbao }}
{{- if $o.enabled }}
{{- if ne .Values.externalSecrets.storeKind "SecretStore" }}
{{- fail "secretStore.openbao renders a namespaced SecretStore: set externalSecrets.storeKind to SecretStore" }}
{{- end }}
{{- if not (hasPrefix "https://" $o.server) }}
{{- fail "secretStore.openbao.server must be an https:// URL" }}
{{- end }}
{{- $reader := printf "%s-openbao-reader" .Release.Name }}
{{- $ca := printf "%s-openbao-ca" .Release.Name }}
{{- $stores := list (dict "namespace" .Release.Namespace "name" .Values.externalSecrets.storeName "role" (default (printf "%s-platform" .Release.Name) $o.auth.role)) }}
{{- if $o.workspace.enabled }}
{{- $stores = append $stores (dict "namespace" .Values.workspaceNamespace "name" $o.workspace.storeName "role" (default (printf "%s-workspace" .Release.Name) $o.workspace.role)) }}
{{- end }}
{{- range $store := $stores }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $reader }}
  namespace: {{ $store.namespace }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: openbao-reader}
# ESO requests a short-lived token for this account; no pod mounts it.
automountServiceAccountToken: false
{{- if $o.caBundle }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $ca }}
  namespace: {{ $store.namespace }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: openbao-ca}
data:
  ca.crt: {{ $o.caBundle | quote }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $store.name }}
  namespace: {{ $store.namespace }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: openbao-store}
spec:
  provider:
    vault:
      server: {{ $o.server | quote }}
      path: {{ $o.path | quote }}
      version: v2
      {{- if $o.caBundle }}
      caProvider: {type: ConfigMap, name: {{ $ca }}, key: ca.crt}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ $o.auth.mountPath | quote }}
          role: {{ $store.role | quote }}
          serviceAccountRef:
            name: {{ $reader }}
            {{- if $o.auth.audience }}
            audiences: [{{ $o.auth.audience | quote }}]
            {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled $o.gatewayEgress.enabled }}
---
# The gateway reaches OpenBao for transit encryption of the credential key.
# NetworkPolicies add up: this opens 8200 for the gateway pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-gateway-openbao
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway}
  policyTypes: [Egress]
  egress:
    - to:
        {{- if $o.gatewayEgress.to }}
        {{- toYaml $o.gatewayEgress.to | nindent 8 }}
        {{- else }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $o.gatewayEgress.namespace }}}
          podSelector:
            matchLabels: {{ toYaml $o.gatewayEgress.podLabels | nindent 14 }}
        {{- end }}
      ports: [{port: {{ $o.gatewayEgress.port }}, protocol: TCP}]
{{- end }}
