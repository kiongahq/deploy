{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-control
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.workspaceNamespace }}}
      ports: [{port: 8080}, {port: 8081}, {port: 8083}, {port: 8084}, {port: 8087}]
    {{- if .Values.agentDesigner.enabled }}
    # Runner callbacks (gateway internal listener) and model calls (trace-proxy).
    - from:
        - podSelector:
            matchLabels: {kionga.dev/release: {{ .Release.Name }}, app.kubernetes.io/component: agent-designer-runner}
      ports: [{port: 8087}, {port: 8081}]
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.workspaceNamespace }}}
    {{- if .Values.agentDesigner.enabled }}
    - to:
        - podSelector:
            matchLabels: {kionga.dev/release: {{ .Release.Name }}, app.kubernetes.io/component: agent-designer-runner}
      ports: [{port: 9100}]
    {{- end }}
    {{- with .Values.networkPolicy.externalEgress }}
{{ toYaml . | indent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-edge
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}}
      ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-workload-isolation
  namespace: {{ .Values.workspaceNamespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
      ports: [{port: 8080}, {port: 8081}, {port: 8888}, {port: 7860}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
      ports: [{port: 8080}, {port: 8081}, {port: 8083}, {port: 8084}, {port: 8087}]
{{- end }}
