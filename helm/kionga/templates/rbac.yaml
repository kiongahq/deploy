apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Values.workspaceNamespace }}
rules:
  - apiGroups: [kionga.dev]
    resources: [kiongaagents, kiongaagents/status, kiongaworkspaces, kiongaworkspaces/status, kiongamodelpromotions, kiongamodelpromotions/status, kiongatools, kiongatools/status, kiongaconnections, kiongaconnections/status, kiongaapplications, kiongaapplications/status, kiongafunctions, kiongafunctions/status, kiongamodeldeployments, kiongamodeldeployments/status]
    verbs: [get, list, watch, create, update, patch, delete]
  # Finalizers let the operator clean up what a deleted application owned.
  - apiGroups: [kionga.dev]
    resources: [kiongaapplications/finalizers, kiongafunctions/finalizers, kiongamodeldeployments/finalizers]
    verbs: [update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  # Applications and functions: public hosts, disruption budgets, and the
  # service accounts model servers read their artifacts with.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Source builds run as Jobs; the operator watches them to roll the Deployment.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  # Request-based scaling and scale to zero (KEDA core and HTTP add-on).
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [http.keda.sh]
    resources: [httpscaledobjects, interceptorroutes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims, secrets, configmaps, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.istio.io]
    resources: [virtualservices, destinationrules]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Values.workspaceNamespace }}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-operator, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-operator}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Values.workspaceNamespace }}
rules:
  - apiGroups: [kionga.dev]
    resources: [kiongaagents, kiongaworkspaces, kiongamodelpromotions, kiongatools, kiongaconnections]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-worker
  namespace: {{ .Values.workspaceNamespace }}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-integration-worker, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-worker}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-discovery
  namespace: {{ .Values.workspaceNamespace }}
rules:
  - apiGroups: [kionga.dev]
    resources: [kiongaworkspaces]
    verbs: [get, list, create, update, delete]
  - apiGroups: [kionga.dev]
    resources: [kiongaagents]
    verbs: [get, list]
  # /api/v1/applications, /api/v1/functions and model Deploy: the gateway
  # records the resource, writes the custom resource and reads its status back.
  - apiGroups: [kionga.dev]
    resources: [kiongaapplications, kiongafunctions, kiongamodeldeployments]
    verbs: [get, list, watch, create, update, patch, delete]
  # Logs and events for the applications API.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-discovery
  namespace: {{ .Values.workspaceNamespace }}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-gateway, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-discovery}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-leader
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # The namespaced informer cache also lists these in the control namespace.
  - apiGroups: [networking.istio.io, serving.kserve.io]
    resources: [virtualservices, destinationrules, inferenceservices]
    verbs: [get, list, watch]
  - apiGroups: [kionga.dev, apps, autoscaling, ""]
    resources: [kiongaagents, kiongaworkspaces, kiongamodelpromotions, kiongatools, kiongaconnections, deployments, horizontalpodautoscalers, services, persistentvolumeclaims, secrets, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [kionga.dev, networking.k8s.io, policy, "", keda.sh, http.keda.sh, batch]
    resources: [kiongaapplications, kiongafunctions, kiongamodeldeployments, ingresses, poddisruptionbudgets, serviceaccounts, pods, scaledobjects, httpscaledobjects, interceptorroutes, jobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-leader
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-operator, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-leader}
{{- if .Values.pipelineExecutor.kubernetes }}
---
# Lets the gateway run pipeline nodes as Jobs in one dedicated namespace and
# read the Pods and Events it reports. Nothing cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-pipeline-executor
  namespace: {{ .Values.pipelineExecutor.namespace }}
rules:
  - apiGroups: [batch]
    resources: [jobs, jobs/status]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-pipeline-executor
  namespace: {{ .Values.pipelineExecutor.namespace }}
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-gateway, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-pipeline-executor}
{{- end }}
