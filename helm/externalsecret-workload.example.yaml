# A workload secret from OpenBao for an application or function.
#
# Kionga mounts a Secret into an application or function (secret_refs in the
# API, spec.secretRefs on the resource) only when it carries the label
# kionga.dev/workload-secret=true, so the target template below sets it. The
# operator hashes the Secret's data into the pods, so when the value changes in
# OpenBao, ESO updates the Secret within refreshInterval and the workload rolls.
#
# Prerequisites: secretStore.openbao.enabled and secretStore.openbao.workspace.enabled
# in the chart (a SecretStore named kionga-store in workspaceNamespace, whose
# role reads only kionga/workloads/*). Write the value first, for example:
#   scripts/openbao-bootstrap.sh seed --key-file PATH --from-dir DIR
# with DIR/workloads/billing/API_TOKEN holding the token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-api
  namespace: kionga-workloads
spec:
  refreshInterval: 1h
  secretStoreRef: {name: kionga-store, kind: SecretStore}
  target:
    name: billing-api
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          kionga.dev/workload-secret: "true"
  data:
    # Each key becomes an environment variable of the workload.
    - {secretKey: API_TOKEN, remoteRef: {key: workloads/billing, property: API_TOKEN}}
