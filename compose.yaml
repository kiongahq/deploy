# Kionga local stack, built from sibling checkouts of the component repositories.
# KIONGA_SRC is the directory holding them (default: the parent of this repo):
#
#   <KIONGA_SRC>/{deploy,platform,serving,trace-proxy,agent-runtime,
#                pipeline-runner,sdk-python,workspace}
#
# `make workspace` clones any that are missing. KIONGA_SDK_SOURCE=release builds
# the Python images against the SDK and platform releases instead of the local
# checkouts. Released, digest-pinned images for a server live in vm/compose.yaml.
name: mlaiops

services:
  postgres:
    restart: unless-stopped
    # pgvector build of PostgreSQL 16: same database, plus the vector extension
    # used by agent long-term memory and RAG.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mlaiops
      POSTGRES_PASSWORD: mlaiops-local
      POSTGRES_DB: mlaiops
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mlaiops]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7.4.5-alpine
    command: [redis-server, --appendonly, "yes"]
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    restart: unless-stopped
    image: apache/kafka:3.9.1
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-rest:
    restart: unless-stopped
    # Karapace is an Apache-licensed, Confluent-v2-compatible Kafka REST proxy.
    # Its multi-architecture image is substantially smaller than the JVM proxy
    # image, which keeps a cold local bootstrap practical on laptops.
    image: ghcr.io/aiven-open/karapace:6.1.4
    entrypoint: [python3, -m, karapace.kafka_rest_apis]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KARAPACE_KARAPACE_REST: "true"
      KARAPACE_KARAPACE_REGISTRY: "false"
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8082
      KARAPACE_ADVERTISED_HOSTNAME: kafka-rest
      KARAPACE_ADVERTISED_PROTOCOL: http
      KARAPACE_REST_BASE_URI: http://kafka-rest:8082
      KARAPACE_BOOTSTRAP_URI: kafka:9092
      KARAPACE_CLIENT_ID: kionga-kafka-rest
      KARAPACE_LOG_LEVEL: INFO
      KARAPACE_PRODUCER_ACKS: all
      KARAPACE_KAFKA_RETRIABLE_ERRORS_SILENCED: "true"
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${KAFKA_REST_PORT:-8082}:8082"]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8082/_health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Bundled S3-compatible object store: RustFS (Apache-2.0).
  objectstore:
    restart: unless-stopped
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:-mlaiops}
      RUSTFS_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:-mlaiops-local-secret}
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${OBJECTSTORE_PORT:-9000}:9000", "${KIONGA_BIND_ADDRESS:-127.0.0.1}:${OBJECTSTORE_CONSOLE_PORT:-9001}:9001"]
    volumes: [objectstore-data:/data]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  objectstore-init:
    # Creates the platform buckets (idempotent). Reuses the MLflow build, which
    # already includes boto3.
    image: mlaiops-mlflow
    build:
      context: mlflow
    depends_on:
      objectstore: {condition: service_healthy}
    entrypoint: [python, /bootstrap/objectstore-init.py]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECTSTORE_ACCESS_KEY:-mlaiops}
      AWS_SECRET_ACCESS_KEY: ${OBJECTSTORE_SECRET_KEY:-mlaiops-local-secret}
      S3_ENDPOINT: http://objectstore:9000
    volumes:
      - ./objectstore-init.py:/bootstrap/objectstore-init.py:ro

  mlflow:
    restart: unless-stopped
    image: mlaiops-mlflow
    build:
      context: mlflow
    depends_on:
      postgres: {condition: service_healthy}
      objectstore-init: {condition: service_completed_successfully}
    # Migrate first: a database created by an older MLflow refuses to start
    # until `mlflow db upgrade` runs (a no-op when already current).
    command:
      - sh
      - -c
      - >-
        mlflow db upgrade "$$BACKEND_STORE_URI" &&
        exec mlflow server --host=0.0.0.0 --port=5000
        --backend-store-uri="$$BACKEND_STORE_URI" --default-artifact-root=s3://mlaiops-models
    environment:
      BACKEND_STORE_URI: postgresql://mlaiops:mlaiops-local@postgres:5432/mlaiops
      # MLflow rejects unknown Host headers (DNS-rebinding protection). Allow
      # the in-network name and the published localhost port only.
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*
      MLFLOW_S3_ENDPOINT_URL: http://objectstore:9000
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${MLFLOW_PORT:-15000}:5000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---- sign-in: every method on by default ---------------------------------
  # Dex brokers single sign-on; the gateway trusts it and keeps local accounts
  # as break-glass. Locally: a GLAuth test directory (password kionga-sso-dev:
  # ada -> admin, grace -> engineer, alan -> signs up), a no-credentials demo
  # account, and GitHub / Google / GitLab / Microsoft once their KIONGA_*_CLIENT_ID
  # and _SECRET are set (.env). See sso/dex.yaml.
  glauth:
    restart: unless-stopped
    image: glauth/glauth:v2.5.4@sha256:6d448805cf54fc2ca3bca2b87f89dffe571a354a69a667b5a910111be3cf430e
    # The image's start script runs glauth with /app/config/config.cfg.
    volumes:
      - ./sso/glauth.cfg:/app/config/config.cfg:ro
    expose: ["3893"]

  dex:
    restart: unless-stopped
    image: ghcr.io/dexidp/dex:v2.46.0@sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777
    # Render the connectors enabled by the environment, derive the login-page
    # provider list from them (shared with the gateway), then serve.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        gomplate -f /etc/kionga-sso/dex.yaml -o /tmp/dex.yaml &&
        gomplate -d dex=/tmp/dex.yaml -f /etc/kionga-sso/providers.tmpl -o /var/dex/providers.json.tmp &&
        mv /var/dex/providers.json.tmp /var/dex/providers.json &&
        exec dex serve /tmp/dex.yaml
    environment:
      DEX_ISSUER: ${DEX_ISSUER:-http://localhost:${DEX_PORT:-5556}/dex}
      KIONGA_GATEWAY_URL: ${KIONGA_GATEWAY_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      DEX_KIONGA_CLIENT_SECRET: ${DEX_KIONGA_CLIENT_SECRET:-kionga-local-sso-client-secret}
      DEX_LDAP_BIND_PASSWORD: ${DEX_LDAP_BIND_PASSWORD:-dex-bind-dev}
      KIONGA_SSO_LDAP: ${KIONGA_SSO_LDAP:-true}
      KIONGA_LDAP_NAME: ${KIONGA_LDAP_NAME:-}
      KIONGA_LDAP_HOST: ${KIONGA_LDAP_HOST:-}
      KIONGA_LDAP_INSECURE_NO_SSL: ${KIONGA_LDAP_INSECURE_NO_SSL:-}
      KIONGA_LDAP_BIND_DN: ${KIONGA_LDAP_BIND_DN:-}
      KIONGA_LDAP_BASE_DN: ${KIONGA_LDAP_BASE_DN:-}
      KIONGA_LDAP_GROUP_BASE_DN: ${KIONGA_LDAP_GROUP_BASE_DN:-}
      KIONGA_SSO_DEMO: ${KIONGA_SSO_DEMO:-true}
      KIONGA_GITHUB_CLIENT_ID: ${KIONGA_GITHUB_CLIENT_ID:-}
      KIONGA_GITHUB_CLIENT_SECRET: ${KIONGA_GITHUB_CLIENT_SECRET:-}
      KIONGA_GITHUB_ORG: ${KIONGA_GITHUB_ORG:-}
      KIONGA_GOOGLE_CLIENT_ID: ${KIONGA_GOOGLE_CLIENT_ID:-}
      KIONGA_GOOGLE_CLIENT_SECRET: ${KIONGA_GOOGLE_CLIENT_SECRET:-}
      KIONGA_GOOGLE_HOSTED_DOMAIN: ${KIONGA_GOOGLE_HOSTED_DOMAIN:-}
      KIONGA_GITLAB_CLIENT_ID: ${KIONGA_GITLAB_CLIENT_ID:-}
      KIONGA_GITLAB_CLIENT_SECRET: ${KIONGA_GITLAB_CLIENT_SECRET:-}
      KIONGA_GITLAB_URL: ${KIONGA_GITLAB_URL:-https://gitlab.com}
      KIONGA_MICROSOFT_CLIENT_ID: ${KIONGA_MICROSOFT_CLIENT_ID:-}
      KIONGA_MICROSOFT_CLIENT_SECRET: ${KIONGA_MICROSOFT_CLIENT_SECRET:-}
      KIONGA_MICROSOFT_TENANT: ${KIONGA_MICROSOFT_TENANT:-common}
    volumes:
      - ./sso:/etc/kionga-sso:ro
      - sso-providers:/var/dex
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${DEX_PORT:-5556}:5556"]
    depends_on:
      glauth: {condition: service_started, required: false}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:5556/dex/.well-known/openid-configuration]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway:
    restart: unless-stopped
    build:
      context: ${KIONGA_SRC:-..}/platform/go
      dockerfile: Dockerfile
      args: {SERVICE: gateway}
    depends_on:
      postgres: {condition: service_healthy}
      kafka-rest: {condition: service_healthy}
      objectstore-init: {condition: service_completed_successfully}
      dex: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://mlaiops:mlaiops-local@postgres:5432/mlaiops?sslmode=disable
      KAFKA_REST_URL: http://kafka-rest:8082
      KIONGA_LOG_EXPORTER_URL: ${KIONGA_LOG_EXPORTER_URL:-http://log-exporter:8086}
      MLAIOPS_TENANT: local
      MLAIOPS_INTERNAL_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      KIONGA_JUPYTER_UPSTREAM: http://jupyter:8888
      KIONGA_CREDENTIAL_KEY: ${KIONGA_CREDENTIAL_KEY:-}
      KIONGA_IDE_UPSTREAM: http://ide:8080
      KIONGA_LANGFLOW_UPSTREAM: http://langflow:7860
      # Optional knowledge backends. Register each base with an env: reference.
      KIONGA_QDRANT_KEY: ${KIONGA_QDRANT_KEY:-}
      KIONGA_KNOWLEDGE_DSN: ${KIONGA_KNOWLEDGE_DSN:-}
      KIONGA_JUPYTER_TOKEN: ${JUPYTER_TOKEN:-mlaiops-local}
      # Shared with jupyter and ide: authorizes structured scaffold jobs.
      KIONGA_WORKSPACE_JOB_TOKEN: ${KIONGA_WORKSPACE_JOB_TOKEN:-kionga-local-workspace-jobs}
      KIONGA_WORKSPACE_API_TOKEN: ${KIONGA_WORKSPACE_API_TOKEN:-kionga-local-workspace-api-identity-change-me}
      AGENT_RUNTIME_URL: http://agent-runtime:9000
      STORAGE_PROXY_URL: http://storage-proxy:8084
      PREFECT_API_URL: http://prefect-server:4200/api
      SERVING_MANAGER_URL: http://serving-manager:8085
      LANGFUSE_URL: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      OPENFAAS_URL: ${OPENFAAS_URL:-}
      OPENFAAS_USER: ${OPENFAAS_USER:-admin}
      OPENFAAS_PASSWORD: ${OPENFAAS_PASSWORD:-}
      # Local-mode RBAC role for unauthenticated requests: admin | operator |
      # user | engineer | viewer. Public deployments use OIDC claims instead.
      MLAIOPS_LOCAL_ROLE: ${MLAIOPS_LOCAL_ROLE:-admin}
      # Sign-in: single sign-on through Dex (browser at localhost, gateway at
      # dex:5556, one issuer) plus local accounts as break-glass.
      OIDC_ISSUER: ${DEX_ISSUER:-http://localhost:${DEX_PORT:-5556}/dex}
      OIDC_AUDIENCE: kionga
      OIDC_CLIENT_ID: kionga
      OIDC_CLIENT_SECRET: ${DEX_KIONGA_CLIENT_SECRET:-kionga-local-sso-client-secret}
      OIDC_AUTH_URL: ${DEX_ISSUER:-http://localhost:${DEX_PORT:-5556}/dex}/auth
      OIDC_TOKEN_URL: http://dex:5556/dex/token
      OIDC_JWKS_URL: http://dex:5556/dex/keys
      OIDC_REDIRECT_URL: ${KIONGA_GATEWAY_URL:-http://localhost:${GATEWAY_PORT:-8080}}/auth/callback
      OIDC_SCOPES: openid profile email groups federated:id   # federated:id: Dex names the connector used
      KIONGA_SSO_SINGLE_TENANT: "true"
      KIONGA_SSO_PROVIDERS_FILE: /etc/kionga/sso/providers.json
      KIONGA_SSO_GROUP_ROLES: '{"ml-admins":"admin","data-team":"engineer"}'
      # Sign-up on first single sign-on: approval (an access request for an
      # administrator) | open (a starter account at once) | off.
      KIONGA_SIGNUP: ${KIONGA_SIGNUP:-approval}
      KIONGA_SIGNUP_EMAIL_DOMAINS: ${KIONGA_SIGNUP_EMAIL_DOMAINS:-}
      KIONGA_SIGNUP_PROFILE: ${KIONGA_SIGNUP_PROFILE:-starter}
      KIONGA_LOCAL_LOGIN: "true"
      MLAIOPS_LOCAL_USERNAME: ${MLAIOPS_LOCAL_USERNAME:-admin}
      MLAIOPS_LOCAL_PASSWORD: ${MLAIOPS_LOCAL_PASSWORD:-mlaiops-local}
      # Engineering blog media (images) live in object storage.
      KIONGA_BLOG_MEDIA_BACKEND: s3
      KIONGA_BLOG_MEDIA_S3_ENDPOINT: http://objectstore:9000
      KIONGA_BLOG_MEDIA_S3_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:-mlaiops}
      KIONGA_BLOG_MEDIA_S3_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:-mlaiops-local-secret}
      KIONGA_BLOG_MEDIA_BUCKET: kionga-blog-media
    volumes:
      - sso-providers:/etc/kionga/sso:ro
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"]

  feature-gateway:
    restart: unless-stopped
    build:
      context: ${KIONGA_SRC:-..}/platform/go
      dockerfile: Dockerfile
      args: {SERVICE: feature-gateway}
    depends_on:
      redis: {condition: service_healthy}
    environment:
      MLAIOPS_INTERNAL_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      REDIS_URL: redis://redis:6379
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${FEATURE_GATEWAY_PORT:-8083}:8083"]

  # Optional: export logs to Elasticsearch/OpenSearch. Enable with
  #   docker compose --profile log-export up -d log-exporter
  # and set KIONGA_LOG_EXPORT_* in .env (secrets as files under config/secrets).
  log-exporter:
    restart: unless-stopped
    profiles: [log-export]
    build:
      context: ${KIONGA_SRC:-..}/platform/go
      dockerfile: Dockerfile
      args: {SERVICE: log-exporter}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://mlaiops:mlaiops-local@postgres:5432/mlaiops?sslmode=disable
      MLAIOPS_TENANT: ${MLAIOPS_TENANT:-default}
      KIONGA_LOG_EXPORT_TARGET: ${KIONGA_LOG_EXPORT_TARGET:-}
      KIONGA_LOG_EXPORT_URL: ${KIONGA_LOG_EXPORT_URL:-}
      KIONGA_LOG_EXPORT_USERNAME: ${KIONGA_LOG_EXPORT_USERNAME:-}
      KIONGA_LOG_EXPORT_API_KEY_FILE: ${KIONGA_LOG_EXPORT_API_KEY_FILE:-}
      KIONGA_LOG_EXPORT_PASSWORD_FILE: ${KIONGA_LOG_EXPORT_PASSWORD_FILE:-}
      KIONGA_LOG_EXPORT_CA_FILE: ${KIONGA_LOG_EXPORT_CA_FILE:-}
      KIONGA_LOG_EXPORT_ANONYMOUS: ${KIONGA_LOG_EXPORT_ANONYMOUS:-false}
      KIONGA_LOG_EXPORT_INSECURE_TLS: ${KIONGA_LOG_EXPORT_INSECURE_TLS:-false}
      KIONGA_LOG_EXPORT_BATCH: ${KIONGA_LOG_EXPORT_BATCH:-}
    volumes:
      - ./config/secrets:/run/kionga-secrets:ro
    ports: ["127.0.0.1:${LOG_EXPORTER_PORT:-8086}:8086"]

  # Local, unauthenticated test targets for the exporter (large images).
  elasticsearch:
    profiles: [log-export-es]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment: {discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m"}
    ports: ["127.0.0.1:9200:9200"]

  opensearch:
    profiles: [log-export-os]
    image: opensearchproject/opensearch:2.17.1
    environment: {discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"}
    ports: ["127.0.0.1:9201:9200"]

  storage-proxy:
    restart: unless-stopped
    build:
      context: ${KIONGA_SRC:-..}/platform/go
      dockerfile: Dockerfile
      args: {SERVICE: storage-proxy}
    depends_on:
      objectstore: {condition: service_healthy}
    environment:
      MLAIOPS_INTERNAL_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      S3_ENDPOINT: http://objectstore:9000
      S3_ACCESS_KEY: mlaiops
      S3_SECRET_KEY: mlaiops-local-secret
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${STORAGE_PROXY_PORT:-8084}:8084"]

  langfuse:
    restart: unless-stopped
    image: langfuse/langfuse:2
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://mlaiops:mlaiops-local@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-mlaiops-local-nextauth}
      SALT: ${LANGFUSE_SALT:-mlaiops-local-salt}
      TELEMETRY_ENABLED: "false"
      # Headless init so the stack boots with working keys; override for
      # anything public.
      LANGFUSE_INIT_ORG_ID: mlaiops
      LANGFUSE_INIT_ORG_NAME: mlaiops
      LANGFUSE_INIT_PROJECT_ID: mlaiops-local
      LANGFUSE_INIT_PROJECT_NAME: mlaiops-local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@local.dev}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Local Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-mlaiops-local-admin}
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${LANGFUSE_PORT:-3000}:3000"]

  prefect-server:
    restart: unless-stopped
    image: prefecthq/prefect:3-latest
    command: [prefect, server, start, --host, "0.0.0.0"]
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${PREFECT_PORT:-4200}:4200"]
    volumes: [prefect-data:/root/.prefect]
    healthcheck:
      test: [CMD-SHELL, python -c "import urllib.request;urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  pipeline-runner:
    build:
      context: ${KIONGA_SRC:-..}/pipeline-runner
    depends_on:
      prefect-server: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      MLAIOPS_URL: http://gateway:8080
      MLAIOPS_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://objectstore:9000
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
      DOCKER_HOST: unix:///var/run/docker.sock
      MLAIOPS_PIPELINE_NETWORK: mlaiops_default
      MLAIOPS_PIPELINE_LOG_LIMIT_BYTES: ${MLAIOPS_PIPELINE_LOG_LIMIT_BYTES:-65536}
      MLAIOPS_PIPELINE_JOB_TIMEOUT_SECONDS: ${MLAIOPS_PIPELINE_JOB_TIMEOUT_SECONDS:-3600}
      MLAIOPS_PIPELINE_PIDS_LIMIT: ${MLAIOPS_PIPELINE_PIDS_LIMIT:-256}
    # Docker-socket access is a deliberate root-equivalent trust boundary for the
    # local/single-operator profile, not multi-tenant isolation. User job containers
    # never receive the socket, drop all capabilities, use no-new-privileges and a
    # bounded PID limit, and are removed after every attempt.
    user: "0:0"
    volumes:
      - ${KIONGA_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped

  serving-manager:
    restart: unless-stopped
    build:
      context: ${KIONGA_SRC:-..}/serving
    # Root inside this designated engine-control service: the Docker socket
    # requires it. The pipeline-runner is the only other socket consumer.
    user: "0:0"
    volumes:
      - ${KIONGA_ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      MLAIOPS_INTERNAL_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      SERVE_IMAGE: mlaiops-mlflow
      SERVE_PIDS_LIMIT: ${SERVE_PIDS_LIMIT:-256}
      # Empty: negotiate with the daemon. Pin with a value such as v1.44.
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-}
      PLATFORM_NETWORK: mlaiops_default
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://objectstore:9000
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${SERVING_MANAGER_PORT:-8085}:8085"]

  realtime-processor:
    build:
      context: ${KIONGA_SRC:-..}/agent-runtime
      args:
        SDK_SOURCE: ${KIONGA_SDK_SOURCE:-local}
      additional_contexts:
        sdk: ${KIONGA_SRC:-..}/sdk-python
    depends_on:
      kafka-rest: {condition: service_started}
      feature-gateway: {condition: service_started}
    entrypoint: ["python", "-m", "realtime.service"]
    environment:
      KAFKA_REST_URL: http://kafka-rest:8082
      MLAIOPS_URL: http://gateway:8080
      MLAIOPS_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      MLAIOPS_FEATURE_GATEWAY_URL: http://feature-gateway:8083
      CALLCENTER_AGENT_ID: ${CALLCENTER_AGENT_ID:-}
      FRAUD_MODEL_ENDPOINT: ${FRAUD_MODEL_ENDPOINT:-}
    restart: unless-stopped

  feature-materializer:
    # The agent runtime image already contains the features package and SDK extras.
    image: mlaiops-agent-runtime
    pull_policy: never   # built locally by agent-runtime; never pulled from a registry
    depends_on:
      gateway: {condition: service_started}
      feature-gateway: {condition: service_started}
      storage-proxy: {condition: service_started}
    environment:
      MLAIOPS_URL: http://gateway:8080
      MLAIOPS_FEATURE_GATEWAY_URL: http://feature-gateway:8083
      MLAIOPS_STORAGE_PROXY_URL: http://storage-proxy:8084
      MLAIOPS_INTERNAL_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
    entrypoint: ["python", "-m", "features.materialize"]
    restart: "no"

  trace-proxy:
    restart: unless-stopped
    build:
      context: ${KIONGA_SRC:-..}/trace-proxy
    depends_on:
      kafka-rest: {condition: service_started}
    environment:
      # All agent LLM calls egress here; requests forward to the configured
      # provider and every call is published to mlaiops.llm.traces.
      LLM_UPSTREAM_URL: ${LLM_UPSTREAM_URL:-https://api.openai.com}
      TRACE_SINK_FORMAT: kafka-rest
      TRACE_SINK_URL: http://kafka-rest:8082/topics/mlaiops.llm.traces
      MLAIOPS_AGENT_NAME: shared
      MLAIOPS_AGENT_VERSION: local
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${TRACE_PROXY_PORT:-8081}:8081"]

  agent-runtime:
    restart: unless-stopped
    image: mlaiops-agent-runtime
    build:
      context: ${KIONGA_SRC:-..}/agent-runtime
      args:
        SDK_EXTRAS: ${AGENT_RUNTIME_EXTRAS:-runtime}
        SDK_SOURCE: ${KIONGA_SDK_SOURCE:-local}
      additional_contexts:
        sdk: ${KIONGA_SRC:-..}/sdk-python
    depends_on:
      postgres: {condition: service_healthy}
      trace-proxy: {condition: service_started}
    environment:
      MLAIOPS_GRAPH_MODULE: ${MLAIOPS_GRAPH_MODULE:-agents.customer_support.graph:build}
      MLAIOPS_AGENT_NAME: customer-support
      AGNO_MODEL: ${AGNO_MODEL:-}
      MLAIOPS_INTERNAL_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      MLAIOPS_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      MLAIOPS_AGENT_ID: ${MLAIOPS_AGENT_ID:-}
      MLAIOPS_URL: http://gateway:8080
      DATABASE_URL: postgres://mlaiops:mlaiops-local@postgres:5432/mlaiops?sslmode=disable
      # mock by default: the stack works with zero API keys. Set
      # MLAIOPS_LLM_BACKEND=openai (plus OPENAI_API_KEY) or anthropic for real
      # models; calls egress through the trace-proxy.
      MLAIOPS_LLM_BACKEND: ${MLAIOPS_LLM_BACKEND:-mock}
      MLAIOPS_LLM_MODEL: ${MLAIOPS_LLM_MODEL:-}
      MLAIOPS_LLM_BASE_URL: ${MLAIOPS_LLM_BASE_URL:-http://trace-proxy:8081/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MLAIOPS_FEATURE_GATEWAY_URL: http://feature-gateway:8083
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    # host 19000: the object store owns host port 9000
    ports: ["${KIONGA_BIND_ADDRESS:-127.0.0.1}:${AGENT_RUNTIME_PORT:-19000}:9000"]

  jupyter:
    restart: unless-stopped
    build:
      context: ${KIONGA_SRC:-..}/workspace
      dockerfile: jupyter/Dockerfile
      args:
        PLATFORM_SOURCE: ${KIONGA_SDK_SOURCE:-local}
      additional_contexts:
        sdk: ${KIONGA_SRC:-..}/sdk-python
        agent-runtime: ${KIONGA_SRC:-..}/agent-runtime
        pipeline-runner: ${KIONGA_SRC:-..}/pipeline-runner
    depends_on:
      mlflow: {condition: service_healthy}
      gateway: {condition: service_started}
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-mlaiops-local}
      KIONGA_WORKSPACE_JOB_TOKEN: ${KIONGA_WORKSPACE_JOB_TOKEN:-kionga-local-workspace-jobs}
      KIONGA_WORKSPACE_API_TOKEN: ${KIONGA_WORKSPACE_API_TOKEN:-kionga-local-workspace-api-identity-change-me}
      KIONGA_WORKSPACE_NAME: local
      KIONGA_GATEWAY_INTERNAL_URL: http://gateway:8087
      MLAIOPS_URL: http://127.0.0.1:8890
      MLAIOPS_FEATURE_GATEWAY_URL: http://feature-gateway:8083
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://objectstore:9000
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
      S3_ENDPOINT: http://objectstore:9000
      S3_MOUNT_ROOT: /workspace/object-store
      S3_MOUNT_BUCKETS: mlaiops-models mlaiops-artifacts mlaiops-features mlaiops-traces mlaiops-agents mlaiops-pipeline-logs
      KAFKA_REST_URL: http://kafka-rest:8082
      PREFECT_API_URL: http://prefect-server:4200/api
      DATABASE_URL: postgres://mlaiops:mlaiops-local@postgres:5432/mlaiops?sslmode=disable
      REDIS_URL: redis://redis:6379
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KIONGA_CUSTOM_AGENT_COMMAND: ${KIONGA_CUSTOM_AGENT_COMMAND:-}
    ports: ["127.0.0.1:${JUPYTER_PORT:-8888}:8888"]
    volumes:
      - jupyter-data:/workspace
      - workspace-codex:/home/dev/.codex
      - workspace-claude:/home/dev/.claude
    cap_add: [SYS_ADMIN]
    devices: [/dev/fuse:/dev/fuse]
    security_opt: [apparmor:unconfined]
    # Probe the same prefixed API the gateway proxies to. An image that
    # predates the base_url (or a token mismatch) turns the service unhealthy
    # instead of silently failing every console launch.
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8888/workspaces/workbench/api/status', headers={'Authorization': 'token ' + os.environ.get('JUPYTER_TOKEN', 'mlaiops-local')}), timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4

  ide:
    restart: unless-stopped
    profiles: [ide]
    build:
      context: ${KIONGA_SRC:-..}/workspace
      dockerfile: ide/Dockerfile
      args:
        INSTALL_CODING_AGENTS: ${KIONGA_IDE_AGENTS:-false}
    environment:
      PASSWORD: ${IDE_PASSWORD:-mlaiops-local}
      KIONGA_IDE_AUTH_MODE: none
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KIONGA_CUSTOM_AGENT_COMMAND: ${KIONGA_CUSTOM_AGENT_COMMAND:-}
      KIONGA_WORKSPACE: /workspace
      KIONGA_WORKSPACE_JOB_TOKEN: ${KIONGA_WORKSPACE_JOB_TOKEN:-kionga-local-workspace-jobs}
      KIONGA_WORKSPACE_API_TOKEN: ${KIONGA_WORKSPACE_API_TOKEN:-kionga-local-workspace-api-identity-change-me}
      KIONGA_WORKSPACE_NAME: local
      KIONGA_GATEWAY_INTERNAL_URL: http://gateway:8087
      MLAIOPS_URL: http://127.0.0.1:8890
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://objectstore:9000
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
    expose: ["8080"]
    volumes:
      - jupyter-data:/workspace
      - workspace-codex:/home/coder/.codex
      - workspace-claude:/home/coder/.claude

  langflow:
    build:
      context: ${KIONGA_SRC:-..}/workspace
      dockerfile: langflow/Dockerfile
    restart: unless-stopped
    profiles: [langflow]
    environment:
      LANGFLOW_ROOT_PATH: /workspaces/langflow
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_SAVE_DB_IN_CONFIG_DIR: "true"
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_SKIP_AUTH_AUTO_LOGIN: "true"
      LANGFLOW_RESTRICT_LOCAL_FILE_ACCESS: "true"
      LANGFLOW_COMPONENTS_PATH: /app/kionga-components
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:-kionga-local-langflow-change-me}
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY:-kionga-local-langflow-secret-change-me}
    expose: ["7860"]
    volumes:
      - langflow-data:/app/langflow

  langflow-sidecar:
    build:
      context: ${KIONGA_SRC:-..}/workspace
      dockerfile: langflow/Dockerfile.sidecar
    restart: unless-stopped
    profiles: [langflow]
    network_mode: service:langflow
    depends_on:
      langflow: {condition: service_started}
    environment:
      KIONGA_WORKSPACE_NAME: local
      KIONGA_WORKSPACE_API_TOKEN: ${KIONGA_WORKSPACE_API_TOKEN:-kionga-local-workspace-api-identity-change-me}
      KIONGA_GATEWAY_INTERNAL_URL: http://gateway:8087

volumes:
  sso-providers:
  postgres-data:
  redis-data:
  objectstore-data:
  prefect-data:
  jupyter-data:
  workspace-codex:
  workspace-claude:
  langflow-data:
