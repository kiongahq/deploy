name: mlaiops

services:
  postgres:
    # pgvector build of PostgreSQL 16: same database, plus the vector extension
    # used by agent long-term memory and RAG.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mlaiops
      POSTGRES_PASSWORD: mlaiops-local
      POSTGRES_DB: mlaiops
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mlaiops]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.5-alpine
    command: [redis-server, --appendonly, "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-rest:
    # Karapace is an Apache-licensed, Confluent-v2-compatible Kafka REST proxy.
    # Its multi-architecture image is substantially smaller than the JVM proxy
    # image, which keeps a cold local bootstrap practical on laptops.
    image: ghcr.io/aiven-open/karapace:6.1.4
    entrypoint: [python3, -m, karapace.kafka_rest_apis]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KARAPACE_KARAPACE_REST: "true"
      KARAPACE_KARAPACE_REGISTRY: "false"
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8082
      KARAPACE_ADVERTISED_HOSTNAME: kafka-rest
      KARAPACE_ADVERTISED_PROTOCOL: http
      KARAPACE_REST_BASE_URI: http://kafka-rest:8082
      KARAPACE_BOOTSTRAP_URI: kafka:9092
      KARAPACE_CLIENT_ID: kionga-kafka-rest
      KARAPACE_LOG_LEVEL: INFO
      KARAPACE_PRODUCER_ACKS: all
      KARAPACE_KAFKA_RETRIABLE_ERRORS_SILENCED: "true"
    ports: ["${KAFKA_REST_PORT:-8082}:8082"]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8082/_health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mlaiops
      MINIO_ROOT_PASSWORD: mlaiops-local-secret
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio-data:/data]

  minio-init:
    # Reuse the MLflow build (which includes boto3) instead of pulling a
    # separate mc image. The upstream minio/mc repository may be unavailable.
    image: mlaiops-mlflow
    build:
      context: mlflow
    depends_on:
      minio: {condition: service_started}
    entrypoint: [python, /bootstrap/minio-init.py]
    environment:
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./minio-init.py:/bootstrap/minio-init.py:ro

  mlflow:
    image: mlaiops-mlflow
    build:
      context: mlflow
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://mlaiops:mlaiops-local@postgres:5432/mlaiops
      - --default-artifact-root=s3://mlaiops-models
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
    ports: ["${MLFLOW_PORT:-15000}:5000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    build:
      context: ../go
      dockerfile: Dockerfile
      args: {SERVICE: gateway}
    depends_on:
      postgres: {condition: service_healthy}
      kafka-rest: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgres://mlaiops:mlaiops-local@postgres:5432/mlaiops?sslmode=disable
      KAFKA_REST_URL: http://kafka-rest:8082
      MLAIOPS_TENANT: local
      MLAIOPS_INTERNAL_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      KIONGA_JUPYTER_UPSTREAM: http://jupyter:8888
      KIONGA_CREDENTIAL_KEY: ${KIONGA_CREDENTIAL_KEY:-}
      KIONGA_IDE_UPSTREAM: http://ide:8080
      KIONGA_JUPYTER_TOKEN: ${JUPYTER_TOKEN:-mlaiops-local}
      AGENT_RUNTIME_URL: http://agent-runtime:9000
      STORAGE_PROXY_URL: http://storage-proxy:8084
      PREFECT_API_URL: http://prefect-server:4200/api
      SERVING_MANAGER_URL: http://serving-manager:8085
      LANGFUSE_URL: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      OPENFAAS_URL: ${OPENFAAS_URL:-}
      OPENFAAS_USER: ${OPENFAAS_USER:-admin}
      OPENFAAS_PASSWORD: ${OPENFAAS_PASSWORD:-}
      # Local-mode RBAC role for unauthenticated requests: admin | operator |
      # user | engineer | viewer. Public deployments use OIDC claims instead.
      MLAIOPS_LOCAL_ROLE: ${MLAIOPS_LOCAL_ROLE:-admin}
      MLAIOPS_LOCAL_USERNAME: ${MLAIOPS_LOCAL_USERNAME:-admin}
      MLAIOPS_LOCAL_PASSWORD: ${MLAIOPS_LOCAL_PASSWORD:-mlaiops-local}
      # Engineering blog media (images) live in object storage.
      KIONGA_BLOG_MEDIA_BACKEND: s3
      KIONGA_BLOG_MEDIA_S3_ENDPOINT: http://minio:9000
      KIONGA_BLOG_MEDIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-mlaiops}
      KIONGA_BLOG_MEDIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-mlaiops-local-secret}
      KIONGA_BLOG_MEDIA_BUCKET: kionga-blog-media
    ports: ["${GATEWAY_PORT:-8080}:8080"]

  feature-gateway:
    build:
      context: ..
      args: {SERVICE: feature-gateway}
    depends_on:
      redis: {condition: service_healthy}
    environment:
      REDIS_URL: redis://redis:6379
    ports: ["${FEATURE_GATEWAY_PORT:-8083}:8083"]

  storage-proxy:
    build:
      context: ..
      args: {SERVICE: storage-proxy}
    depends_on:
      minio: {condition: service_started}
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: mlaiops
      S3_SECRET_KEY: mlaiops-local-secret
    ports: ["${STORAGE_PROXY_PORT:-8084}:8084"]

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://mlaiops:mlaiops-local@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-mlaiops-local-nextauth}
      SALT: ${LANGFUSE_SALT:-mlaiops-local-salt}
      TELEMETRY_ENABLED: "false"
      # Headless init so the stack boots with working keys; override for
      # anything public.
      LANGFUSE_INIT_ORG_ID: mlaiops
      LANGFUSE_INIT_ORG_NAME: mlaiops
      LANGFUSE_INIT_PROJECT_ID: mlaiops-local
      LANGFUSE_INIT_PROJECT_NAME: mlaiops-local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@local.dev}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Local Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-mlaiops-local-admin}
    ports: ["${LANGFUSE_PORT:-3000}:3000"]

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: [prefect, server, start, --host, "0.0.0.0"]
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports: ["${PREFECT_PORT:-4200}:4200"]
    volumes: [prefect-data:/root/.prefect]
    healthcheck:
      test: [CMD-SHELL, python -c "import urllib.request;urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

  pipeline-runner:
    build:
      context: ..
      dockerfile: python/pipelines/Dockerfile
    depends_on:
      prefect-server: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      MLAIOPS_URL: http://gateway:8080
      MLAIOPS_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
      DOCKER_HOST: unix:///var/run/docker.sock
      MLAIOPS_PIPELINE_NETWORK: mlaiops_default
      MLAIOPS_PIPELINE_LOG_LIMIT_BYTES: ${MLAIOPS_PIPELINE_LOG_LIMIT_BYTES:-65536}
      MLAIOPS_PIPELINE_JOB_TIMEOUT_SECONDS: ${MLAIOPS_PIPELINE_JOB_TIMEOUT_SECONDS:-3600}
      MLAIOPS_PIPELINE_PIDS_LIMIT: ${MLAIOPS_PIPELINE_PIDS_LIMIT:-256}
    # Docker-socket access is a deliberate root-equivalent trust boundary for the
    # local/single-operator profile, not multi-tenant isolation. User job containers
    # never receive the socket, drop all capabilities, use no-new-privileges and a
    # bounded PID limit, and are removed after every attempt.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  serving-manager:
    build:
      context: ..
      args: {SERVICE: serving-manager}
    # Root inside this designated engine-control service: the Docker socket
    # requires it. The pipeline-runner is the only other socket consumer.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SERVE_IMAGE: mlaiops-mlflow
      SERVE_PIDS_LIMIT: ${SERVE_PIDS_LIMIT:-256}
      PLATFORM_NETWORK: mlaiops_default
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
    ports: ["${SERVING_MANAGER_PORT:-8085}:8085"]

  realtime-processor:
    build:
      context: ..
      dockerfile: python/agent_runtime/Dockerfile
    depends_on:
      kafka-rest: {condition: service_started}
      feature-gateway: {condition: service_started}
    entrypoint: ["python", "-m", "realtime.service"]
    environment:
      KAFKA_REST_URL: http://kafka-rest:8082
      MLAIOPS_URL: http://gateway:8080
      MLAIOPS_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      MLAIOPS_FEATURE_GATEWAY_URL: http://feature-gateway:8083
      CALLCENTER_AGENT_ID: ${CALLCENTER_AGENT_ID:-}
      FRAUD_MODEL_ENDPOINT: ${FRAUD_MODEL_ENDPOINT:-}
    restart: unless-stopped

  feature-materializer:
    # The agent runtime already contains python/features and the same SDK extras.
    image: mlaiops-agent-runtime
    depends_on:
      gateway: {condition: service_started}
      feature-gateway: {condition: service_started}
      storage-proxy: {condition: service_started}
    environment:
      MLAIOPS_URL: http://gateway:8080
      MLAIOPS_FEATURE_GATEWAY_URL: http://feature-gateway:8083
      MLAIOPS_STORAGE_PROXY_URL: http://storage-proxy:8084
      MLAIOPS_INTERNAL_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
    entrypoint: ["python", "-m", "features.materialize"]
    restart: "no"

  trace-proxy:
    build:
      context: ..
      args: {SERVICE: trace-proxy}
    depends_on:
      kafka-rest: {condition: service_started}
    environment:
      # All agent LLM calls egress here; requests forward to the configured
      # provider and every call is published to mlaiops.llm.traces.
      LLM_UPSTREAM_URL: ${LLM_UPSTREAM_URL:-https://api.openai.com}
      TRACE_SINK_FORMAT: kafka-rest
      TRACE_SINK_URL: http://kafka-rest:8082/topics/mlaiops.llm.traces
      MLAIOPS_AGENT_NAME: shared
      MLAIOPS_AGENT_VERSION: local
    ports: ["${TRACE_PROXY_PORT:-8081}:8081"]

  agent-runtime:
    image: mlaiops-agent-runtime
    build:
      context: ..
      dockerfile: python/agent_runtime/Dockerfile
      args:
        SDK_EXTRAS: ${AGENT_RUNTIME_EXTRAS:-runtime}
    depends_on:
      postgres: {condition: service_healthy}
      trace-proxy: {condition: service_started}
    environment:
      MLAIOPS_GRAPH_MODULE: ${MLAIOPS_GRAPH_MODULE:-agents.customer_support.graph:build}
      MLAIOPS_AGENT_NAME: customer-support
      AGNO_MODEL: ${AGNO_MODEL:-}
      MLAIOPS_INTERNAL_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      MLAIOPS_TOKEN: ${MLAIOPS_INTERNAL_TOKEN:-kionga-local-service-token}
      MLAIOPS_AGENT_ID: ${MLAIOPS_AGENT_ID:-}
      MLAIOPS_URL: http://gateway:8080
      DATABASE_URL: postgres://mlaiops:mlaiops-local@postgres:5432/mlaiops?sslmode=disable
      # mock by default: the stack works with zero API keys. Set
      # MLAIOPS_LLM_BACKEND=openai (plus OPENAI_API_KEY) or anthropic for real
      # models; calls egress through the trace-proxy.
      MLAIOPS_LLM_BACKEND: ${MLAIOPS_LLM_BACKEND:-mock}
      MLAIOPS_LLM_MODEL: ${MLAIOPS_LLM_MODEL:-}
      MLAIOPS_LLM_BASE_URL: ${MLAIOPS_LLM_BASE_URL:-http://trace-proxy:8081/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MLAIOPS_FEATURE_GATEWAY_URL: http://feature-gateway:8083
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    # host 19000: MinIO owns host port 9000
    ports: ["${AGENT_RUNTIME_PORT:-19000}:9000"]

  jupyter:
    build:
      context: ..
      dockerfile: deploy/jupyter/Dockerfile
    depends_on:
      mlflow: {condition: service_healthy}
      gateway: {condition: service_started}
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-mlaiops-local}
      MLAIOPS_URL: http://gateway:8080
      MLAIOPS_FEATURE_GATEWAY_URL: http://feature-gateway:8083
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
      S3_ENDPOINT: http://minio:9000
      S3_MOUNT_ROOT: /workspace/object-store
      S3_MOUNT_BUCKETS: mlaiops-models mlaiops-artifacts mlaiops-features mlaiops-traces mlaiops-agents mlaiops-pipeline-logs
      KAFKA_REST_URL: http://kafka-rest:8082
      PREFECT_API_URL: http://prefect-server:4200/api
      DATABASE_URL: postgres://mlaiops:mlaiops-local@postgres:5432/mlaiops?sslmode=disable
      REDIS_URL: redis://redis:6379
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KIONGA_CUSTOM_AGENT_COMMAND: ${KIONGA_CUSTOM_AGENT_COMMAND:-}
    ports: ["127.0.0.1:${JUPYTER_PORT:-8888}:8888"]
    volumes:
      - jupyter-data:/workspace
      - workspace-codex:/home/dev/.codex
      - workspace-claude:/home/dev/.claude
    cap_add: [SYS_ADMIN]
    devices: [/dev/fuse:/dev/fuse]
    security_opt: [apparmor:unconfined]
    # Probe the same prefixed API the gateway proxies to. An image that
    # predates the base_url (or a token mismatch) turns the service unhealthy
    # instead of silently failing every console launch.
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8888/workspaces/workbench/api/status', headers={'Authorization': 'token ' + os.environ.get('JUPYTER_TOKEN', 'mlaiops-local')}), timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4

  ide:
    profiles: [ide]
    build:
      context: .
      dockerfile: ide/Dockerfile
      args:
        INSTALL_CODING_AGENTS: ${KIONGA_IDE_AGENTS:-false}
    environment:
      PASSWORD: ${IDE_PASSWORD:-mlaiops-local}
      KIONGA_IDE_AUTH_MODE: none
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KIONGA_CUSTOM_AGENT_COMMAND: ${KIONGA_CUSTOM_AGENT_COMMAND:-}
      KIONGA_WORKSPACE: /workspace
      MLAIOPS_URL: http://gateway:8080
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: mlaiops
      AWS_SECRET_ACCESS_KEY: mlaiops-local-secret
    expose: ["8080"]
    volumes:
      - jupyter-data:/workspace
      - workspace-codex:/home/coder/.codex
      - workspace-claude:/home/coder/.claude

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prefect-data:
  jupyter-data:
  workspace-codex:
  workspace-claude:
