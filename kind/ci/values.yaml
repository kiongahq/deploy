# Chart values for the kind e2e lane. The workflow adds image digests from the
# local registry. Hosts use sslip.io, which resolves any name containing
# 127.0.0.1 to 127.0.0.1, where kind publishes Traefik.
storageClass: standard
ingress:
  enabled: true
  className: traefik
  host: kionga.127.0.0.1.sslip.io
  tlsSecretName: kionga-tls
  controllerNamespace: ingress-system
workspaceIngress:
  enabled: false
components:
  gateway:
    replicas: 2
    port: 8080
    health: /api/v1/health
    ready: /api/v1/ready
    secrets: [DATABASE_URL, OIDC_CLIENT_SECRET, KIONGA_INTERNAL_TOKEN, KIONGA_CREDENTIAL_KEY, KIONGA_LOCAL_PASSWORD]
gatewayAutoscaling:
  enabled: false
trustedCA:
  configMapName: kionga-e2e-ca
  key: ca.crt
config:
  KIONGA_ENVIRONMENT: production
  KIONGA_ALLOWED_ORIGIN: https://kionga.127.0.0.1.sslip.io
  # The lane signs in with the break-glass local account. These single sign-on
  # endpoints satisfy production validation and are never contacted.
  KIONGA_LOCAL_LOGIN: "true"
  OIDC_ISSUER: https://idp.e2e.invalid
  OIDC_JWKS_URL: https://idp.e2e.invalid/keys
  OIDC_AUTH_URL: https://idp.e2e.invalid/auth
  OIDC_TOKEN_URL: https://idp.e2e.invalid/token
  OIDC_REDIRECT_URL: https://kionga.127.0.0.1.sslip.io/auth/callback
  MLFLOW_URL: http://mlflow.kionga-data.svc:5000
  WORKSPACE_MLFLOW_URL: http://mlflow.kionga-data.svc:5000
  S3_ENDPOINT: http://objectstore.kionga-data.svc:9000
pipelineExecutor:
  kubernetes: true
  namespace: kionga-pipelines
applications:
  enabled: true
  baseDomain: apps.127.0.0.1.sslip.io
  tls:
    clusterIssuer: kionga-e2e-ca
    secretName: kionga-applications-tls
  fallbackIngress:
    enabled: true
    annotations: {traefik.ingress.kubernetes.io/router.priority: "1"}
functions:
  enabled: true
  scaleDownSeconds: 30
keda:
  enabled: true
kserve:
  enabled: true
  storageSecretName: kionga-model-storage
  storage:
    endpoint: objectstore.kionga-data.svc:9000
    useHTTPS: false
    artifactsDestination: s3://kionga-models
  storageEgress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kionga-data}}}]
      ports: [{port: 9000}]
networkPolicy:
  enabled: true
  externalEgress:
    # PostgreSQL, MLflow and the object store run in kionga-data in this lane.
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kionga-data}}}]
      ports: [{port: 5432}, {port: 5000}, {port: 9000}]
    # The Kubernetes API: the kubernetes Service and the kind node network.
    - to: [{ipBlock: {cidr: 10.96.0.1/32}}, {ipBlock: {cidr: 172.16.0.0/12}}]
      ports: [{port: 443}, {port: 6443}]
preflight:
  enabled: true
# Every platform Secret comes from OpenBao through External Secrets Operator.
# scripts/kind-ci-up.sh seeds the values and passes the CA with --set-file.
# The short refresh lets the rotation step see a change within seconds.
secretStore:
  openbao:
    enabled: true
    workspace:
      enabled: true
externalSecrets:
  enabled: true
  storeName: kionga-store
  refreshInterval: 10s
  targets:
    kionga-gateway:
      - {secretKey: DATABASE_URL, remoteRef: {key: gateway, property: DATABASE_URL}}
      - {secretKey: OIDC_CLIENT_SECRET, remoteRef: {key: gateway, property: OIDC_CLIENT_SECRET}}
      - {secretKey: KIONGA_INTERNAL_TOKEN, remoteRef: {key: shared, property: KIONGA_INTERNAL_TOKEN}}
      - {secretKey: KIONGA_CREDENTIAL_KEY, remoteRef: {key: gateway, property: KIONGA_CREDENTIAL_KEY}}
      - {secretKey: KIONGA_LOCAL_PASSWORD, remoteRef: {key: gateway, property: KIONGA_LOCAL_PASSWORD}}
    kionga-features:
      - {secretKey: REDIS_URL, remoteRef: {key: features, property: REDIS_URL}}
      - {secretKey: KIONGA_INTERNAL_TOKEN, remoteRef: {key: shared, property: KIONGA_INTERNAL_TOKEN}}
    kionga-storage:
      - {secretKey: S3_ACCESS_KEY, remoteRef: {key: storage, property: S3_ACCESS_KEY}}
      - {secretKey: S3_SECRET_KEY, remoteRef: {key: storage, property: S3_SECRET_KEY}}
      - {secretKey: KIONGA_INTERNAL_TOKEN, remoteRef: {key: shared, property: KIONGA_INTERNAL_TOKEN}}
    kionga-tracing:
      - {secretKey: TRACE_PROXY_KEYS, remoteRef: {key: tracing, property: TRACE_PROXY_KEYS}}
  workspaceTargets:
    kionga-model-storage:
      - {secretKey: AWS_ACCESS_KEY_ID, remoteRef: {key: model-storage, property: AWS_ACCESS_KEY_ID}}
      - {secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: {key: model-storage, property: AWS_SECRET_ACCESS_KEY}}
